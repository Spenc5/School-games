<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life Paths</title>
<style>
:root {
  --bg: #121633;
  --panel: #20265c;
  --panel-2: #2b3277;
  --line: #4a52a8;
  --ink: #ffffff;
  --ink-dim: #c8cbf0;
  --cream: #fffbea;
  --dark: #111111;
  --gold: #ffd23f;
  --good: #2ee66b;
  --bad: #ff5252;
  --turn: #29b6f6;

  --t-social: #4fc3f7;
  --t-share: #ce93d8;
  --t-payday: #69d36e;
  --t-oops: #ff8a65;
  --t-event: #ffd54f;
  --t-help: #f48fb1;
  --t-cope: #80cbc4;
  --t-stop: #ffffff;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Trebuchet MS", "Segoe UI", Roboto, Arial, sans-serif;
  font-size: 18px;
}

button { font: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; }

.app {
  max-width: 1800px;
  margin: 0 auto;
  padding: 10px 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* ---------- Top bar ---------- */
.topbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
.title {
  margin: 0;
  font-size: clamp(1.5rem, 2.2vw, 2rem);
  color: var(--gold);
  text-shadow: 3px 3px 0 #000;
  white-space: nowrap;
}
.top-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.btn {
  border: 3px solid #000;
  border-radius: 14px;
  padding: 6px 14px;
  font-weight: 800;
  font-size: 1rem;
  background: #fff;
  color: #111;
  box-shadow: 0 4px 0 #000;
  transition: transform .08s;
}
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #000; }
.btn:disabled { opacity: .35; }
.btn-big { font-size: 1.3rem; padding: 12px 22px; }
.btn-go { background: var(--good); }
.btn-gold { background: var(--gold); }
.btn-no { background: var(--bad); color: #fff; }
.btn[aria-pressed="true"] { background: var(--good); }

/* ---------- Banner ---------- */
.banner {
  background: var(--turn);
  color: #000;
  border: 4px solid #000;
  border-radius: 18px;
  padding: 6px 18px;
  font-size: 1.7rem;
  font-weight: 900;
  text-align: center;
  box-shadow: 0 5px 0 #000;
}
.banner small { font-size: 1.1rem; font-weight: 700; margin-left: 12px; }

/* ---------- Main layout ---------- */
.main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 12px; align-items: start; }

/* ---------- Board ---------- */
.board-wrap {
  background: var(--panel);
  border: 3px solid var(--line);
  border-radius: 18px;
  padding: 10px;
  overflow-x: auto;
}
.board { container-type: inline-size; min-width: 720px; display: flex; flex-direction: column; gap: 6px; }
.brow { display: grid; grid-template-columns: 4.2cqw repeat(11, minmax(0, 1fr)); gap: 0.5cqw; }
.rlabel {
  writing-mode: vertical-rl;
  transform: rotate(180deg);
  text-align: center;
  font-weight: 900;
  font-size: 1.3cqw;
  color: var(--gold);
  background: var(--panel-2);
  border-radius: 10px;
  border: 2px solid var(--line);
  display: grid; place-items: center;
  letter-spacing: 1px;
}
.cell {
  position: relative;
  aspect-ratio: 1 / 1.05;
  background: var(--tc);
  color: #000;
  border: 3px solid #000;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding-top: .5cqw;
  overflow: hidden;
}
.cell .num { position: absolute; top: 2px; left: 5px; font-size: .9cqw; font-weight: 900; opacity: .65; }
.cell .dir { position: absolute; top: 2px; right: 5px; font-size: 1cqw; font-weight: 900; opacity: .65; }
.cell .ic { font-size: 2.7cqw; line-height: 1.1; }
.cell .lb { font-size: 1.02cqw; font-weight: 900; text-align: center; line-height: 1.05; padding: 0 2px; }
.cell.stop { border: 5px solid #d50000; box-shadow: inset 0 0 0 3px #fff; }
.cell.stop .lb::before { content: "STOP · "; color: #d50000; }
.cell.clickable { cursor: pointer; }
.cell.next {
  outline: 6px solid var(--gold);
  outline-offset: 2px;
  z-index: 1;
  animation: glow 1s ease-in-out infinite;
}
@keyframes glow { 50% { outline-color: #fff; transform: scale(1.06); } }
.cell.here {
  outline: 6px solid var(--pc);
  outline-offset: 2px;
  z-index: 1;
}
.here-badge, .step-badge {
  position: absolute; top: 2px; left: 0; right: 0;
  margin: 0 auto;
  width: fit-content;
  border: 2px solid #000;
  border-radius: 999px;
  padding: 0 .5cqw;
  font-size: 1cqw;
  font-weight: 900;
  white-space: nowrap;
  z-index: 2;
}
.here-badge { background: var(--pc); color: #000; }
.step-badge { background: var(--gold); color: #000; animation: bob .8s ease-in-out infinite; }
.cell.here .num, .cell.here .dir, .cell.next .num, .cell.next .dir { visibility: hidden; }
.moves { color: var(--gold); font-size: 1.5rem; }
.steps { font-size: 1.35rem; font-weight: 800; line-height: 1.45; margin: 6px 0 10px; padding-left: 28px; }
.trigger { background: #fff; border: 3px solid #000; border-radius: 14px; padding: 8px 14px; font-size: 1.2rem; font-weight: 800; margin-bottom: 10px; }
.showit { margin-top: 12px; border: 4px dashed #00897b; border-radius: 16px; padding: 10px 14px; background: #e0f2f1; }
.showit h3 { margin: 0 0 4px; font-size: 1.25rem; }
.showit p { margin: 4px 0; font-size: 1.2rem; font-weight: 800; }
.dorow { display: grid; grid-template-columns: minmax(0, 1fr) 230px; gap: 14px; align-items: center; }
.guide { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 6px 0; }
@media (max-width: 700px) { .dorow { grid-template-columns: 1fr; } }
.breath {
  width: 150px; height: 150px;
  border-radius: 50%;
  background: radial-gradient(circle, #b2dfdb, #26a69a);
  border: 5px solid #000;
  display: grid; place-items: center;
  font-size: 3rem; font-weight: 900; color: #000;
  transform: scale(.55);
  transition-property: transform;
  transition-timing-function: ease-in-out;
}
.breath-label { font-size: 1.2rem; font-weight: 900; text-align: center; min-height: 2.6em; }
.cell.start, .cell.finish { background: repeating-linear-gradient(45deg, #fff 0 8px, #ffe082 8px 16px); }
.tokens {
  position: absolute; left: 0; right: 0; bottom: 3px;
  display: flex; flex-wrap: wrap; justify-content: center; gap: 1px;
}
.token {
  width: 3cqw; height: 3cqw;
  border-radius: 50%;
  background: #fff;
  border: .35cqw solid var(--pc);
  display: grid; place-items: center;
  font-size: 1.8cqw;
  box-shadow: 0 2px 0 #000;
}
.token.now { animation: bob .9s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-5px); } }

.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-weight: 800; font-size: .95rem; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 18px; height: 18px; border-radius: 4px; border: 2px solid #000; background: var(--tc); display: inline-block; }

/* ---------- Sidebar ---------- */
.side { display: flex; flex-direction: column; gap: 12px; }
.panel {
  background: var(--panel);
  border: 3px solid var(--line);
  border-radius: 18px;
  padding: 12px;
}
.panel h2 { margin: 0 0 8px; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px; color: var(--gold); }
.spinbox { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.wheel { position: relative; width: 190px; height: 190px; border-radius: 50%; }
.wheel.ready { cursor: pointer; }
.wheel.ready:hover { transform: scale(1.04); }
.wheel.ready::after {
  content: "👆 Tap me!";
  position: absolute; left: 0; right: 0; bottom: -6px;
  margin: 0 auto;
  width: fit-content;
  background: var(--gold); color: #000;
  border: 3px solid #000; border-radius: 999px;
  padding: 1px 10px;
  font-weight: 900; font-size: 1rem;
  white-space: nowrap;
  animation: bob .9s ease-in-out infinite;
  z-index: 3;
}
.wheel svg { width: 100%; height: 100%; display: block; }
.pointer {
  position: absolute; top: -6px; left: 50%;
  transform: translateX(-50%);
  width: 0; height: 0;
  border-left: 16px solid transparent;
  border-right: 16px solid transparent;
  border-top: 30px solid #fff;
  filter: drop-shadow(0 3px 0 #000);
  z-index: 2;
}
#wheelRot { transform-origin: 110px 110px; }
.spin-result { font-size: 1.3rem; font-weight: 900; min-height: 1.6em; text-align: center; }
.spinbtn { width: 100%; font-size: 1.6rem; padding: 12px; background: var(--gold); }

.pcard {
  border: 4px solid var(--pc);
  border-radius: 14px;
  padding: 6px 10px;
  background: var(--panel-2);
  margin-bottom: 6px;
}
.pcard.now { box-shadow: 0 0 0 4px var(--gold); }
.pcard.done { opacity: .75; }
.phead { display: flex; align-items: center; gap: 8px; font-size: 1.25rem; font-weight: 900; }
.phead .av { font-size: 1.6rem; }
.phead .nm { color: var(--pc); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pstats { display: flex; gap: 10px; font-size: 1.25rem; font-weight: 900; color: #fff; }
.pstats .neg { color: #ff8a80; }
.pinfo { font-size: .9rem; font-weight: 700; color: var(--ink-dim); line-height: 1.3; margin-top: 2px; }

/* ---------- Modals / cards ---------- */
.overlay {
  position: fixed; inset: 0;
  background: rgba(6, 8, 28, .78);
  display: grid;
  padding: 16px;
  z-index: 40;
  overflow-y: auto;
}
.modal {
  background: var(--cream);
  color: var(--dark);
  border: 5px solid #000;
  border-radius: 22px;
  box-shadow: 0 10px 0 #000;
  width: min(860px, 100%);
  margin: auto; /* centred when it fits, scrollable from the top when it doesn't */
  overflow: hidden;
  animation: zoom .25s ease-out;
}
.modal.wide { width: min(1200px, 100%); }
@keyframes zoom { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.mhead {
  background: var(--tc, var(--gold));
  border-bottom: 4px solid #000;
  padding: 10px 18px;
  display: flex; align-items: center; gap: 12px;
}
.mhead .ic { font-size: 2.6rem; line-height: 1; }
.mhead h2 { margin: 0; font-size: 1.9rem; flex: 1; }
.mhead .who { font-weight: 900; font-size: 1.1rem; background: #fff; border: 3px solid #000; border-radius: 999px; padding: 2px 12px; }
.mbody { padding: 16px 22px 20px; }
.scen { font-size: 1.6rem; font-weight: 800; line-height: 1.3; margin: 4px 0 14px; }
.choices { display: flex; flex-direction: column; gap: 10px; }
.choice {
  text-align: left;
  border: 4px solid #000;
  border-radius: 14px;
  background: #fff;
  padding: 12px 16px;
  font-size: 1.3rem;
  font-weight: 800;
  box-shadow: 0 4px 0 #000;
  display: flex; gap: 12px; align-items: center;
}
.choice:hover { background: #fff3b0; }
.choice .let {
  flex: none;
  width: 40px; height: 40px;
  border-radius: 50%;
  background: #000; color: #fff;
  display: grid; place-items: center;
  font-weight: 900;
}
.picked { background: #fff3b0; border: 4px solid #000; border-radius: 14px; padding: 10px 14px; font-size: 1.3rem; font-weight: 800; }
.fb { font-size: 1.25rem; font-weight: 700; margin: 10px 0; }
.fx {
  display: inline-block;
  background: #000; color: #fff;
  border-radius: 999px;
  padding: 4px 14px;
  font-weight: 900; font-size: 1.2rem;
}
.talk {
  margin-top: 14px;
  border: 4px dashed #7e57c2;
  border-radius: 16px;
  padding: 12px 14px;
  background: #f3ecff;
}
.talk h3 { margin: 0 0 6px; font-size: 1.3rem; }
.talk p { margin: 4px 0 8px; font-size: 1.3rem; font-weight: 800; }
.talk .hint { font-size: 1rem; font-weight: 700; color: #4a3a7a; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
.row.end { justify-content: space-between; }
.pbtn { border-color: #000; background: #fff; }
.pbtn.on { background: var(--good); }
.starters { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.starters span { background: #fff; border: 2px solid #7e57c2; border-radius: 999px; padding: 3px 10px; font-weight: 800; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.opt {
  border: 4px solid #000; border-radius: 16px; background: #fff;
  padding: 12px; text-align: center; box-shadow: 0 4px 0 #000;
  font-weight: 800;
}
.opt:hover:not(:disabled) { background: #fff3b0; }
.opt.on { background: var(--good); }
.opt .big { font-size: 2.6rem; display: block; }
.opt .t { font-size: 1.25rem; font-weight: 900; display: block; }
.opt .d { font-size: 1rem; display: block; margin-top: 4px; }
.small-note { font-size: 1rem; font-weight: 700; color: #555; }

/* Setup */
.setup-row { display: flex; gap: 10px; align-items: center; margin: 8px 0; }
.setup-row input {
  flex: 1; min-width: 0;
  font: inherit; font-size: 1.3rem; font-weight: 800;
  padding: 8px 12px;
  border: 4px solid var(--pc); border-radius: 12px;
}
.avbtn { font-size: 2rem; width: 62px; height: 58px; border: 4px solid var(--pc); border-radius: 12px; background: #fff; padding: 0; }
.seg { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.seg .btn[aria-pressed="true"] { background: var(--gold); }
.label { font-weight: 900; font-size: 1.15rem; margin: 14px 0 6px; }

/* Party */
.party { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.pp { border: 4px solid var(--pc); border-radius: 16px; background: #fff; padding: 10px 12px; }
.pp .rank { font-size: 1.1rem; font-weight: 900; }
.pp .who { font-size: 1.5rem; font-weight: 900; }
.pp .pts { font-size: 2rem; font-weight: 900; }
.pp ul { padding-left: 18px; margin: 6px 0; font-size: .95rem; font-weight: 600; max-height: 170px; overflow-y: auto; }
.pp .awards { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
.pp .awards span { background: var(--gold); border: 2px solid #000; border-radius: 999px; padding: 1px 8px; font-weight: 900; font-size: .9rem; }
.breakdown { font-weight: 800; font-size: 1rem; }
.reflect { margin-top: 14px; background: #f3ecff; border: 4px dashed #7e57c2; border-radius: 16px; padding: 10px 14px; }
.reflect ol { font-size: 1.2rem; font-weight: 800; margin: 6px 0; }
.helplist { font-size: 1.1rem; font-weight: 600; line-height: 1.45; padding-left: 22px; }

/* Toast */
.toast {
  position: fixed; left: 50%; top: 12px;
  transform: translateX(-50%);
  background: var(--gold); color: #000;
  border: 4px solid #000; border-radius: 16px;
  padding: 10px 22px; font-size: 1.3rem; font-weight: 900;
  box-shadow: 0 6px 0 #000;
  z-index: 60; max-width: calc(100vw - 32px); text-align: center;
}

@media (max-width: 1100px) {
  .main { grid-template-columns: 1fr; }
  .side { display: grid; grid-template-columns: 260px 1fr; }
}
@media (max-width: 700px) {
  html, body { font-size: 16px; }
  .side { grid-template-columns: 1fr; }
  .banner { font-size: 1.35rem; }
  .scen { font-size: 1.3rem; }
  .choice { font-size: 1.1rem; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1 class="title">🛤️ Life Paths</h1>
    <div class="top-actions" id="topActions"></div>
  </header>
  <div class="banner" id="banner" role="status" aria-live="polite"></div>
  <div class="main">
    <section class="board-wrap" aria-label="Game board">
      <div class="board" id="board"></div>
      <div class="legend" id="legend"></div>
    </section>
    <aside class="side">
      <section class="panel spinbox" aria-label="Spinner">
        <div class="wheel" id="wheelBtn" data-action="spin" role="button" tabindex="0" aria-label="Spin the spinner"><div class="pointer"></div><div id="wheel"></div></div>
        <div class="spin-result" id="spinResult" aria-live="polite"></div>
        <button class="btn spinbtn" id="spinBtn" data-action="spin">🎡 SPIN!</button>
      </section>
      <section class="panel" aria-label="Players">
        <h2>Players</h2>
        <div id="players"></div>
      </section>
    </aside>
  </div>
</div>
<div id="layer"></div>
<div id="toastLayer"></div>

<script>
'use strict';

/* =========================================================
   CONTENT
   ========================================================= */

const AVATARS = ['🦊', '🐼', '🐸', '🦄', '🐯', '🐙', '🦖', '🐧', '🤖', '👽', '🐨', '🦁'];
const PCOLORS = ['#29b6f6', '#ff4fa0', '#2ee66b', '#ffa726'];

const TYPES = {
  start:  { icon: '🚩', label: 'Start', color: '#fff' },
  finish: { icon: '🎉', label: 'Life Party', color: '#fff' },
  social: { icon: '💬', label: 'What would you do?', color: 'var(--t-social)' },
  share:  { icon: '🎤', label: 'Share Time', color: 'var(--t-share)' },
  payday: { icon: '💰', label: 'Payday', color: 'var(--t-payday)' },
  oops:   { icon: '⚡', label: 'Oops!', color: 'var(--t-oops)' },
  event:  { icon: '🎁', label: 'Life Event', color: 'var(--t-event)' },
  help:   { icon: '🤝', label: 'Help a Friend', color: 'var(--t-help)' },
  cope:   { icon: '🧘', label: 'Show a Coping Skill', color: 'var(--t-cope)' },
  path:   { icon: '🎓', label: 'Choose Your Path', color: 'var(--t-stop)', stop: true },
  career: { icon: '💼', label: 'Career Day', color: 'var(--t-stop)', stop: true },
  home:   { icon: '🏠', label: 'Find a Home', color: 'var(--t-stop)', stop: true },
};

// 44 spaces, laid out as 4 rows of 11 in a snake.
const BOARD = [
  'start', 'social', 'payday', 'share', 'social', 'event', 'help', 'path', 'cope', 'oops', 'share',
  'social', 'payday', 'event', 'cope', 'help', 'oops', 'share', 'career', 'social', 'payday', 'event',
  'social', 'share', 'oops', 'payday', 'cope', 'help', 'event', 'home', 'social', 'payday', 'share',
  'social', 'oops', 'event', 'payday', 'cope', 'help', 'share', 'social', 'payday', 'event', 'finish',
];
const ROWS = [
  { label: 'Childhood', stage: 'kid' },
  { label: 'Teen Years', stage: 'teen' },
  { label: 'Starting Out', stage: 'adult' },
  { label: 'Grown-Up Life', stage: 'adult' },
];
const COLS = 11;
const LAST = BOARD.length - 1;
const stageAt = pos => ROWS[Math.min(ROWS.length - 1, Math.floor(pos / COLS))].stage;

/* Social situations. h = hearts, c = coins. */
const SOCIAL = [
  // ---- kid ----
  { stage: 'kid', title: 'New kid at lunch', text: 'A new student is sitting alone at lunch.',
    choices: [
      { t: 'Invite them to sit with you.', h: 2, fb: 'You just made someone\'s whole day better. That\'s how friendships start!' },
      { t: 'Smile and wave, but stay with your friends.', h: 1, fb: 'A friendly wave is a good start. Maybe next time you could say hi.' },
      { t: 'Ignore them. Someone else will talk to them.', h: -1, fb: 'Everyone waiting for "someone else" means nobody helps.' },
    ],
    talk: 'What\'s a good first thing to say to someone new?' },
  { stage: 'kid', title: 'Losing a game', text: 'You\'re playing a board game with friends, and you lose.',
    choices: [
      { t: 'Say "Good game!" and ask for a rematch.', h: 2, fb: 'Being a good sport makes people want to play with you again.' },
      { t: 'Say the game was unfair.', h: -1, fb: 'Blaming the game can make the fun stop for everyone.' },
      { t: 'Quit and walk away.', h: -1, fb: 'It\'s okay to feel frustrated, but walking off can hurt feelings.' },
    ],
    talk: 'What helps YOU feel better after losing?' },
  { stage: 'kid', title: 'Bumping into someone', text: 'You accidentally bump into someone and they drop their books.',
    choices: [
      { t: 'Say sorry and help pick them up.', h: 2, fb: 'Owning an accident and helping fix it shows you care.' },
      { t: 'Say sorry and keep walking.', h: 0, fb: 'Saying sorry is good. Helping too would be even better.' },
      { t: 'Laugh at the mess.', h: -2, fb: 'Laughing can make the other person feel embarrassed.' },
    ],
    talk: 'Why does saying sorry for an accident still matter?' },
  { stage: 'kid', title: 'Joining a game', text: 'Kids are already playing a game at recess, and you want to join.',
    choices: [
      { t: 'Wait for a break and ask, "Can I play next round?"', h: 2, fb: 'Great timing and a clear question. Most people will say yes!' },
      { t: 'Run in and start playing.', h: -1, fb: 'Jumping in without asking can mess up the game and annoy people.' },
      { t: 'Walk away. They probably don\'t want you.', h: 0, fb: 'You never know until you ask. Most kids like more players!' },
    ],
    talk: 'What could you do if they say "not right now"?' },
  { stage: 'kid', title: 'A compliment', text: 'Someone says, "Wow, I really like your drawing!"',

/* =========================================================

const S = {
  phase: 'setup',     // setup | spin | spinning | move | card | party
  movesLeft: 0,
  players: [],
  turn: 0,
  spinMax: 6,
  autoRead: false,
  sound: true,
  card: null,
  decks: {},
  wheelAngle: 0,
  lastSpin: null,
  finishCount: 0,
  modal: null,        // overlay modals that sit on top: help, confirm-end, confirm-new
  setup: {
    count: 2,
    names: ['', '', '', ''],
    avatars: [0, 1, 2, 3],
    spinMax: 6,
  },
  toast: null,
};

const rand = n => Math.floor(Math.random() * n);
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = rand(i + 1);
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const reduced = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const cur = () => S.players[S.turn];

// Draw without repeats until a deck runs out, then reshuffle.
function drawFrom(key, items) {
  if (!S.decks[key] || !S.decks[key].length) S.decks[key] = shuffle(items.slice());
  return S.decks[key].pop();
}
function drawSocial(pos) {
  const stage = stageAt(pos);
  return drawFrom('social-' + stage, SOCIAL.filter(s => s.stage === stage || s.stage === 'any'));
}

function applyFx(p, c = 0, h = 0) {
  p.coins += c;
  p.hearts = Math.max(0, p.hearts + h);
}
function fxText(c = 0, h = 0) {
  const parts = [];
  if (h) parts.push(`${h > 0 ? '+' : '−'}${Math.abs(h)} ❤️`);
  if (c) parts.push(`${c > 0 ? '+' : '−'}${Math.abs(c)} 💰`);
  return parts.length ? parts.join('  ·  ') : 'No change';
}
const fmtCoins = n => (n < 0 ? '−' : '') + Math.abs(n);

/* =========================================================
   GAME FLOW
   ========================================================= */

function startGame() {
  const st = S.setup;
  S.players = [];
  for (let i = 0; i < st.count; i++) {
    S.players.push({
      name: (st.names[i] || '').trim() || `Player ${i + 1}`,
      avatar: AVATARS[st.avatars[i]],
      color: PCOLORS[i],
      pos: 0,
      coins: START_COINS,
      hearts: 0,
      career: null,
      salary: ALLOWANCE,
      path: null,
      home: null,
      done: false,
      finishPlace: null,
      story: [],
    });
  }
  S.spinMax = st.spinMax;
  S.turn = 0;
  S.decks = {};
  S.card = null;
  S.finishCount = 0;
  S.lastSpin = null;
  S.phase = 'spin';
  S.modal = null;
  buildWheel();
  sfx('yay');
  renderAll();
}

async function spin() {
  if (S.phase !== 'spin') return;
  S.phase = 'spinning';
  const n = S.spinMax;
  const result = 1 + rand(n);
  const centre = (result - 0.5) * 360 / n;
  const target = ((-centre - S.wheelAngle) % 360 + 360) % 360;
  S.wheelAngle += 360 * 4 + target;
  const g = document.getElementById('wheelRot');
  const dur = reduced() ? 0 : 1700;
  g.style.transition = dur ? `transform ${dur}ms cubic-bezier(.15,.85,.25,1)` : 'none';
  g.style.transform = `rotate(${S.wheelAngle}deg)`;
  document.getElementById('spinResult').textContent = 'Spinning...';
  renderSide();
  sfx('spin');
  await sleep(dur + 150);
  S.lastSpin = result;
  S.movesLeft = result;
  S.phase = 'move';
  renderAll();
}

// The furthest space the current move can reach: the spin count, cut short by a STOP space or the finish.
function moveLimit() {
  const p = cur();
  const max = Math.min(LAST, p.pos + S.movesLeft);
  for (let i = p.pos + 1; i <= max; i++) {
    if (BOARD[i] === 'finish' || TYPES[BOARD[i]].stop) return i;
  }
  return max;
}

// The player moves their own piece. Tapping the glowing next space hops one step;
// tapping any space further along (up to where they'll land) moves straight there,
// so players can count step by step or count in their head.
function hop(target) {
  const p = cur();
  if (S.phase !== 'move') return;
  if (target <= p.pos) {
    toast(target === p.pos ? 'That\'s where you are now! Tap the "👣 Step here" space just ahead of you.' : 'Pieces only move forward! Tap a space ahead of you.');
    return;
  }
  const limit = moveLimit();
  if (target > limit) {
    const left = `You have ${S.movesLeft} space${S.movesLeft === 1 ? '' : 's'} to move.`;
    toast(target <= p.pos + S.movesLeft
      ? `🛑 There's a STOP space on the way! You have to stop there first.`
      : `Too far! ${left} Count again, or tap "👣 Step here" to go one space at a time.`);
    return;
  }
  let passedPay = 0;
  const start = p.pos;
  while (p.pos < target) {
    p.pos++;
    S.movesLeft--;
    if (BOARD[p.pos] === 'payday' && p.pos < target) { applyFx(p, p.salary, 0); passedPay++; }
  }
  pieceClicks(target - start);
  // Landing on a payday mid-move (more spaces to go) counts as passing it.
  if (BOARD[p.pos] === 'payday' && S.movesLeft > 0) { applyFx(p, p.salary, 0); passedPay++; }
  const type = BOARD[p.pos];
  if (type === 'finish' || TYPES[type].stop) {
    if (S.movesLeft > 0 && type !== 'finish') toast(`🛑 STOP space! ${p.name} stops here, even with moves left.`);
    else if (passedPay) toast(`💰 ${p.name} passed Payday: +${p.salary * passedPay} coins!`);
    S.movesLeft = 0;
    land();
    return;
  }
  if (passedPay) toast(`💰 ${p.name} passed Payday: +${p.salary * passedPay} coins!`);
  if (S.movesLeft === 0) { land(); return; }
  renderAll();
}

function land() {
  const p = cur();
  const type = BOARD[p.pos];
  const card = { type, step: 'main', talked: [] };
  switch (type) {
    case 'social': {
      card.data = drawSocial(p.pos);
      card.order = shuffle([0, 1, 2]);
      break;
    }
    case 'share': card.q = drawFrom('share', SHARE); break;
    case 'cope': {
      card.trigger = drawFrom('cope-trigger', COPE_TRIGGERS);
      card.options = shuffle(COPING.slice()).slice(0, 3);
      card.didIt = false;
      card.together = false;
      break;
    }
    case 'oops': {
      card.data = drawFrom('oops', OOPS);
      card.order = shuffle([0, 1, 2]);
      card.showSkill = drawFrom('oops-skill', COPING);
      card.showed = false;
      applyFx(p, -card.data.cost, 0);
      break;
    }
    case 'event': {
      const ev = drawFrom('event', EVENTS);
      card.data = ev;
      if (ev.gift) {
        for (const o of S.players) if (o !== p) { o.coins -= ev.gift; p.coins += ev.gift; }
      } else if (ev.all) {
        for (const o of S.players) applyFx(o, 0, ev.all);
      } else {
        applyFx(p, ev.c || 0, ev.h || 0);
      }
      p.story.push(`${ev.icon} ${ev.text}`);
      break;
    }
    case 'payday': {
      card.amount = p.salary + 10;
      applyFx(p, card.amount, 0);
      break;
    }
    case 'help': {
      const others = S.players.map((o, i) => i).filter(i => i !== S.turn);
      card.friend = others.length === 1 ? others[0] : null;
      break;
    }
    case 'path': break;
    case 'career': {
      if (p.path === 'college' && !p.career) card.options = shuffle(COLLEGE_CAREERS.slice()).slice(0, 3);
      else {
        p.salary += 10;
        card.raise = true;
        p.story.push('💼 Got a raise for job experience');
      }
      break;
    }
    case 'home': card.options = shuffle(HOMES.slice()).slice(0, 3); break;
    case 'finish': {
      const place = S.finishCount++;
      card.bonus = FINISH_BONUS[place] || 0;
      card.place = place + 1;
      p.done = true;
      p.finishPlace = place + 1;
      applyFx(p, card.bonus, 0);
      p.story.push(`🎉 Reached the Life Party (#${place + 1})`);
      break;
    }
  }
  S.card = card;
  S.phase = 'card';
  sfx(type === 'oops' ? 'nope' : type === 'payday' || type === 'finish' ? 'yay' : 'pop');
  renderAll();
  if (S.autoRead) readCard();
}

function endTurn() {
  S.card = null;
  speechCancel();
  const n = S.players.length;
  for (let k = 1; k <= n; k++) {
    const idx = (S.turn + k) % n;
    if (!S.players[idx].done) {
      S.turn = idx;
      S.phase = 'spin';
      document.getElementById('spinResult').textContent = '';
      renderAll();
      return;
    }
  }
  S.phase = 'party';
  sfx('yay');
  renderAll();
}

function chooseSocial(idx) {

function talked(i) {
  const c = S.card;
  if (c.talked.includes(i)) return;
  c.talked.push(i);
  applyFx(cur(), 0, 1);

  sfx('good');
}

function chooseCoping(i) {

  cur().story.push(`🧘 Showed a coping skill: ${c.skill.name}`);

// Guided breathing: cycles through the skill's phases a few times, updating the circle in place.
let guideTimer = null;
function stopGuide() {
  clearTimeout(guideTimer);
  guideTimer = null;
}
function startGuide() {
  const c = S.card;
  if (!c || !c.skill || !c.skill.guide) return;
  stopGuide();
  const phases = [];
  for (let r = 0; r < 3; r++) phases.push(...c.skill.guide);
  let k = 0;
  const circle = () => document.getElementById('breath');
  const label = () => document.getElementById('breathLabel');
  const step = () => {
    if (!circle()) { stopGuide(); return; }
    if (k >= phases.length) {
      circle().style.transitionDuration = '1s';
      circle().style.transform = 'scale(.55)';
      circle().textContent = '✓';
      label().textContent = 'Nice and calm. Great job!';
      document.getElementById('guideBtn').textContent = '▶ Do it again';
      guideTimer = null;
      sfx('good');
      return;
    }
    const [text, secs, grow] = phases[k++];
    const el = circle();
    el.style.transitionDuration = secs + 's';
    el.style.transform = grow ? 'scale(1)' : 'scale(.55)';
    label().textContent = `${text} (round ${Math.min(3, Math.ceil(k / c.skill.guide.length))} of 3)`;
    let left = secs;
    el.textContent = left;
    const tick = () => {
      left--;
      if (!circle()) return;
      if (left > 0) { circle().textContent = left; guideTimer = setTimeout(tick, 1000); }
      else step();
    };
    guideTimer = setTimeout(tick, 1000);
  };
  document.getElementById('guideBtn').textContent = '⏹ Stop';
  step();
}

function chooseHelp(wayId) {
  const c = S.card;
  if (c.friend == null) return;
  const p = cur();
  const f = S.players[c.friend];
  const way = HELP_WAYS.find(w => w.id === wayId);
  if (wayId === 'coins') { applyFx(p, -10, 1); applyFx(f, 10, 0); c.fx = `${p.name}: −10 💰 +1 ❤️ · ${f.name}: +10 💰`; }
  else { applyFx(p, 0, 1); applyFx(f, 0, 1); c.fx = `${p.name}: +1 ❤️ · ${f.name}: +1 ❤️`; }
  c.way = way;
  c.step = 'result';
  p.story.push(`🤝 Helped ${f.name}: ${way.t.toLowerCase()}`);
  sfx('good');
}

function choosePath(path) {
  const c = S.card;
  const p = cur();
  p.path = path;
  if (path === 'college') {
    applyFx(p, -COLLEGE_COST, 0);
    p.story.push('🎓 Went to college');
    c.step = 'result';
  } else {
    p.story.push('🛠️ Started working right away');
    c.options = shuffle(WORK_CAREERS.slice()).slice(0, 3);
    c.step = 'career';
  }
  sfx('pop');
}

function chooseCareer(i) {
  const c = S.card;
  const p = cur();
  const job = c.options[i];
  p.career = job;
  p.salary = job.salary;
  p.story.push(`${job.icon} Became a ${job.name}`);
  c.job = job;
  c.step = 'result';
  sfx('yay');
}

function chooseHome(i) {
  const c = S.card;
  const p = cur();
  if (i < 0) {
    c.homeChoice = null;
    p.story.push('🔑 Kept renting');
  } else {
    const h = c.options[i];
    p.home = h;
    applyFx(p, -h.cost, 0);
    c.homeChoice = h;
    p.story.push(`${h.icon} Bought a ${h.name}`);
  }
  c.step = 'result';
  sfx('yay');
}

function renderAll() {
  const c = cur();
  document.documentElement.style.setProperty('--turn', c ? c.color : '#29b6f6');
  renderTop();
  renderBanner();
  renderBoard();
  renderSide();
  renderLayer();

function renderTop() {
  const inGame = S.phase !== 'setup';
  document.getElementById('topActions').innerHTML = `
    <button class="btn" data-action="toggle-read" aria-pressed="${S.autoRead}" title="Read every card aloud automatically">🗣️ Auto-read: ${S.autoRead ? 'ON' : 'OFF'}</button>
    <button class="btn" data-action="toggle-sound" aria-label="${S.sound ? 'Sound on' : 'Sound off'}" title="Sound">${S.sound ? '🔊' : '🔇'}</button>
    <button class="btn" data-action="help">❓ Help</button>
    ${inGame && S.phase !== 'party' ? '<button class="btn" data-action="end-game">🏁 End Game</button>' : ''}
    <button class="btn btn-gold" data-action="new-game">🔄 New Game</button>`;
}

function renderBanner() {
  const b = document.getElementById('banner');
  if (S.phase === 'setup') { b.innerHTML = 'Set up your players to begin!'; return; }
  if (S.phase === 'party') { b.innerHTML = '🎉 Life Party! Let\'s see everyone\'s life story.'; return; }
  const p = cur();
  const others = S.players.filter(o => o !== p).map(o => o.name).join(' & ');
  const sub = S.phase === 'spin' ? 'Tap the spinner to spin!'
    : S.phase === 'spinning' ? 'Spinning...'
    : S.phase === 'move' ? `${S.movesLeft} to go! Tap "👣 Step here" to move one space, or tap where you'll land.`
    : `${others}: listen and join in!`;
  b.innerHTML = `${p.avatar} ${esc(p.name)}'s turn! <small>${esc(sub)}</small>`;
}

function renderBoard() {
  const rows = [];
  for (let r = 0; r < ROWS.length; r++) {
    const idxs = [];
    for (let k = 0; k < COLS; k++) idxs.push(r * COLS + k);
    if (r % 2 === 1) idxs.reverse();
    const cells = idxs.map(i => {
      const type = BOARD[i];
      const T = TYPES[type];
      const here = S.players.map((p, pi) => ({ p, pi })).filter(x => x.p.pos === i && S.phase !== 'setup');
      const tokens = here.map(x =>
        `<span class="token ${x.pi === S.turn && S.phase !== 'party' ? 'now' : ''}" style="--pc:${x.p.color}" title="${esc(x.p.name)}">${x.p.avatar}</span>`).join('');
      const dir = i === LAST ? '' : (r % 2 === 0 ? (i % COLS === COLS - 1 ? '⬇' : '➜') : (i % COLS === COLS - 1 ? '⬇' : '⬅'));
      const moving = S.phase === 'move';
      const next = moving && i === cur().pos + 1;
      // Mark the current player's own space so the glowing "step here" space is clearly the one AHEAD of them.
      const mine = (moving || S.phase === 'spin' || S.phase === 'spinning') && i === cur().pos;
      const cls = ['cell', T.stop && 'stop', type === 'start' && 'start', type === 'finish' && 'finish', moving && 'clickable', next && 'next', mine && 'here'].filter(Boolean).join(' ');
      const label = `${T.label}${here.length ? ', ' + here.map(x => x.p.name).join(', ') + ' here' : ''}${next ? ', tap to move one space' : ''}`;
      const attrs = moving ? `data-action="hop" data-i="${i}" role="button" tabindex="${next ? 0 : -1}"` : '';
      const badge = mine ? `<span class="here-badge" aria-hidden="true">📍 ${esc(cur().name)}</span>`
        : next ? '<span class="step-badge" aria-hidden="true">👣 Step here</span>' : '';
      return `<div class="${cls}" style="--tc:${T.color}${mine ? ';--pc:' + cur().color : ''}" ${attrs} aria-label="Space ${i}: ${esc(label)}">${badge}
        <span class="num">${i || ''}</span><span class="dir" aria-hidden="true">${dir}</span>
        <span class="ic" aria-hidden="true">${T.icon}</span><span class="lb">${T.label}</span>
        <span class="tokens">${tokens}</span></div>`;
    }).join('');
    rows.push(`<div class="brow"><div class="rlabel">${ROWS[r].label}</div>${cells}</div>`);
  }
  document.getElementById('board').innerHTML = rows.join('');
  document.getElementById('legend').innerHTML = ['social', 'share', 'cope', 'help', 'oops', 'event', 'payday'].map(t =>
    `<span><i style="--tc:${TYPES[t].color}"></i>${TYPES[t].icon} ${TYPES[t].label}</span>`).join('') +
    '<span><i style="--tc:#fff;border-color:#d50000"></i>🛑 Stop space</span>';
}

function renderSide() {
  const btn = document.getElementById('spinBtn');
  btn.disabled = S.phase !== 'spin';
  const wheel = document.getElementById('wheelBtn');
  wheel.classList.toggle('ready', S.phase === 'spin');
  wheel.setAttribute('aria-disabled', S.phase !== 'spin');
  btn.textContent = S.phase === 'spin' ? `🎡 SPIN! (1–${S.spinMax})` : '🎡 SPIN!';
  const res = document.getElementById('spinResult');
  if (S.phase === 'move') {
    res.innerHTML = `${esc(cur().name)} spun a ${S.lastSpin}!<br><span class="moves">👣 ${S.movesLeft} space${S.movesLeft === 1 ? '' : 's'} to move</span>`;
  } else if (S.phase === 'spin') {
    res.textContent = '';
  }
  document.getElementById('players').innerHTML = S.players.map((p, i) => `
    <div class="pcard ${i === S.turn && S.phase !== 'party' ? 'now' : ''} ${p.done ? 'done' : ''}" style="--pc:${p.color}">
      <div class="phead"><span class="av">${p.avatar}</span><span class="nm">${esc(p.name)}${p.done ? ' 🎉' : ''}</span>
        <span class="pstats"><span class="${p.coins < 0 ? 'neg' : ''}">💰${fmtCoins(p.coins)}</span><span>❤️${p.hearts}</span></span></div>
      <div class="pinfo">
        ${p.career ? `${p.career.icon} ${esc(p.career.name)}` : p.path === 'college' ? '🎓 In college' : '🧒 No job yet'} · 💵${p.salary}/payday · ${p.home ? `${p.home.icon} ${esc(p.home.name)}` : '🔑 No home'}
      </div>
    </div>`).join('') || '<div class="pinfo">Players appear here.</div>';
}

function buildWheel() {
  const n = S.spinMax;
  const r = 100, cx = 110, cy = 110;
  const pal = ['#ff5252', '#ffd23f', '#2ee66b', '#29b6f6', '#ce93d8', '#ff8a65', '#4dd0e1', '#f48fb1', '#aed581', '#ffb74d'];
  const pt = a => [cx + r * Math.sin(a * Math.PI / 180), cy - r * Math.cos(a * Math.PI / 180)];
  let segs = '';
  for (let i = 0; i < n; i++) {
    const a0 = i * 360 / n, a1 = (i + 1) * 360 / n, mid = (a0 + a1) / 2;
    const [x0, y0] = pt(a0), [x1, y1] = pt(a1);
    const tx = cx + 66 * Math.sin(mid * Math.PI / 180), ty = cy - 66 * Math.cos(mid * Math.PI / 180);
    segs += `<path d="M${cx},${cy} L${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 0 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z" fill="${pal[i % pal.length]}" stroke="#000" stroke-width="3"/>
      <text x="${tx.toFixed(2)}" y="${ty.toFixed(2)}" transform="rotate(${mid} ${tx.toFixed(2)} ${ty.toFixed(2)})" text-anchor="middle" dominant-baseline="central" font-size="${n > 8 ? 24 : 30}" font-weight="900" fill="#000">${i + 1}</text>`;
  }
  S.wheelAngle = 0;
  document.getElementById('wheel').innerHTML = `<svg viewBox="0 0 220 220" role="img" aria-label="Spinner from 1 to ${n}">
    <g id="wheelRot" style="transform: rotate(0deg)">${segs}</g>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#000" stroke-width="6"/>
    <circle cx="${cx}" cy="${cy}" r="14" fill="#fff" stroke="#000" stroke-width="4"/></svg>`;
}

/* --- overlay layer --- */

function renderLayer() {
  let html = '';
  let inner = '';
  if (S.modal) inner = modalHTML(S.modal);
  else if (S.phase === 'setup') inner = setupHTML();
  else if (S.phase === 'party') inner = partyHTML();
  else if (S.phase === 'card' && S.card) inner = cardHTML(S.card);
  if (inner) html = `<div class="overlay" role="dialog" aria-modal="true">${inner}</div>`;
  document.getElementById('layer').innerHTML = html;
}

function renderToast() {
  document.getElementById('toastLayer').innerHTML = S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : '';
}

function head(type, title, extra = '') {
  const T = TYPES[type];
  const p = cur();
  return `<div class="mhead" style="--tc:${T.color}">
    <span class="ic" aria-hidden="true">${T.icon}</span><h2>${esc(title)}</h2>
    ${extra}
    <button class="btn" data-action="read" title="Read this card aloud">🔊 Read</button>
    <span class="who" style="border-color:${p.color}">${p.avatar} ${esc(p.name)}</span>
  </div>`;
}

function othersButtons(label) {
  const c = S.card;
  return S.players.map((o, i) => i === S.turn ? '' :
    `<button class="btn pbtn ${c.talked.includes(i) ? 'on' : ''}" data-action="talked" data-i="${i}" ${c.talked.includes(i) ? 'disabled' : ''} style="border-color:${o.color}">
      ${c.talked.includes(i) ? '✅' : '🙋'} ${esc(o.name)} ${label}</button>`).join('');
}

const doneBtn = (text = '✅ Done: next player ▶') =>
  `<button class="btn btn-big btn-go" data-action="done">${text}</button>`;

function cardHTML(c) {

          <p class="small-note">${isOops ? 'How do you handle it?' : `${esc(p.name)}, pick what you would REALLY do. Think it over out loud!`}</p>
          <div class="choices">${c.order.map((ci, k) =>
            `<button class="choice" data-action="choose" data-i="${ci}"><span class="let">${'ABC'[k]}</span>${esc(d.choices[ci].t)}</button>`).join('')}</div>

        : `Congratulations, ${esc(p.career.name)}! You'll earn ${p.salary} each payday.`;

      return `<div class="modal">${head('finish', 'Life Party!')}<div class="mbody">

function lifePoints(p) {
  return p.coins + p.hearts * HEART_POINTS + (p.home ? p.home.value : 0);
}

function partyHTML() {
  const ranked = S.players.slice().sort((a, b) => lifePoints(b) - lifePoints(a));
  const maxOf = f => Math.max(...S.players.map(f));
  const awards = p => {
    const a = [];
    if (lifePoints(p) === maxOf(lifePoints)) a.push('🏆 Most Life Points');
    if (p.hearts === maxOf(x => x.hearts)) a.push('❤️ Best Friend Award');
    if (p.coins === maxOf(x => x.coins)) a.push('💰 Super Saver');
    if (p.finishPlace === 1) a.push('🥇 First to the Party');
    if (p.home && p.home.value === maxOf(x => x.home ? x.home.value : 0)) a.push('🏠 Dream Home');
    if (!a.length) a.push('🌈 Unique Life Story');
    return a;
  };
  const cards = ranked.map((p, i) => `<div class="pp" style="--pc:${p.color}">
    <div class="rank">#${i + 1}</div>
    <div class="who">${p.avatar} ${esc(p.name)}</div>
    <div class="pts">${lifePoints(p)} pts</div>
    <div class="breakdown">💰 ${fmtCoins(p.coins)} + ❤️ ${p.hearts}×${HEART_POINTS} + 🏠 ${p.home ? p.home.value : 0}</div>
    <div class="awards">${awards(p).map(a => `<span>${a}</span>`).join('')}</div>
    <div class="breakdown">${p.career ? `${p.career.icon} ${esc(p.career.name)}` : '🧒 No career yet'} · ${p.home ? `${p.home.icon} ${esc(p.home.name)}` : '🔑 Renting'}</div>
    <details><summary><b>📖 Life story (${p.story.length})</b></summary><ul>${p.story.map(s => `<li>${esc(s)}</li>`).join('')}</ul></details>
  </div>`).join('');
  return `<div class="modal wide"><div class="mhead" style="--tc:var(--gold)"><span class="ic">🎉</span><h2>The Life Party!</h2>
    <button class="btn btn-go" data-action="new-game">🔄 Play Again</button></div><div class="mbody">
    <p class="small-note">Life Points = coins + 10 for every ❤️ + your home's value.</p>
    <div class="party">${cards}</div>
    <div class="reflect"><h3 style="margin:0">💬 Let's reflect together</h3><ol>
      <li>What was the hardest choice you made? Why?</li>
      <li>Is there a choice you'd make differently now?</li>
      <li>What's one thing someone else did in this game that was kind or smart?</li>
    </ol></div>
  </div></div>`;
}

  if (m.type === 'help') {
    return `<div class="modal"><div class="mhead"><span class="ic">❓</span><h2>How to Play</h2></div><div class="mbody">
      <ul class="helplist">
        <li><b>Goal:</b> travel from childhood to the 🎉 Life Party, making choices along the way. At the end, <b>Life Points = coins + 10 per ❤️ + your home's value</b>. Hearts are worth a lot, so be a good friend!</li>
        <li>On your turn, tap the <b>spinner</b> (or the SPIN button). Then <b>move your own piece</b>, either way: tap the <b>👣 Step here</b> space just ahead of your piece to move one space at a time (count out loud!), or count in your head and tap the space you'll land on to jump straight there.</li>
        <li><b>💬 What would you do?</b> Read the situation, pick what you'd REALLY do, then talk about it. When a friend answers the question, tap their name: you both get +1 ❤️.</li>
        <li><b>🎤 Share Time:</b> answer the question, then a friend asks a follow-up question about your answer.</li>
        <li><b>⚡ Oops!</b> Something goes wrong. Choose how to cope, then <b>show</b> a calm-down strategy for +1 ❤️.</li>
        <li><b>🧘 Show a Coping Skill:</b> pick a calm-down strategy (like Box Breathing or 5-4-3-2-1 Senses) and actually do it for the group. Breathing ones have a guided circle to follow. Everyone can join in!</li>
        <li><b>🤝 Help a Friend</b>, <b>🎁 Life Events</b>, and <b>💰 Payday</b> (you also get paid just for <i>passing</i> Payday).</li>
        <li><b>🛑 Stop spaces</b> (you always stop here): choose college or work, pick a career, and pick a home.</li>
      </ul>
      <h3>For the group leader</h3>
      <ul class="helplist">
        <li><b>On Zoom:</b> share this window and give <b>Remote Control</b> to whoever's turn it is. Everything is click-only.</li>
        <li>🔄 <b>New card</b> swaps out a situation that doesn't fit your group. 🔊 <b>Read</b> reads a card aloud (🗣️ Auto-read does it every time; tick “Share sound” in Zoom).</li>
        <li>🏁 <b>End Game</b> jumps to the Life Party at any time if you run short on time.</li>
        <li>Choices only show their ❤️/💰 effects <i>after</i> you pick, so players think about the situation, not the points.</li>
      </ul>
      <div class="row end"><span></span><button class="btn btn-big btn-go" data-action="close-modal">Got it! 👍</button></div>
    </div></div>`;
  }
  if (m.type === 'confirm-end' || m.type === 'confirm-new') {
    const end = m.type === 'confirm-end';
    return `<div class="modal"><div class="mhead"><span class="ic">${end ? '🏁' : '🔄'}</span><h2>${end ? 'End the game now?' : 'Start a new game?'}</h2></div><div class="mbody">
      <p class="fb">${end ? 'Everyone goes straight to the Life Party with what they have now.' : 'This game will be cleared.'}</p>
      <div class="row end"><button class="btn btn-big" data-action="close-modal">Keep playing</button>
      <button class="btn btn-big btn-go" data-action="${end ? 'really-end' : 'really-new'}">${end ? '🎉 Go to the party' : 'Yes, new game'}</button></div>
    </div></div>`;
  }
  return '';
}

/* =========================================================
   READ ALOUD / SOUND / TOAST
   ========================================================= */

function cardSpeech() {
  const c = S.card;
  if (!c) return '';
  const p = cur();
  switch (c.type) {
    case 'social':
    case 'oops':
      if (c.step === 'main') return `${c.data.text} ${c.order.map((ci, k) => `${'ABC'[k]}: ${c.data.choices[ci].t}`).join(' ')}`;
      return `${c.choice.fb} Talk about it: ${c.type === 'oops' ? 'Has something like this ever happened to you?' : c.data.talk}`;
    case 'share': return `Share time. ${c.q}`;
    case 'cope':
      if (c.step === 'main') return `${c.trigger} Pick a calm-down strategy to show us: ${c.options.map(k => k.name).join(', or ')}.`;
      return `${c.skill.name}. ${c.skill.steps.join(' ')}`;
    case 'event': return `${c.data.text} ${c.data.act || ''}`;
    case 'payday': return `Payday! ${p.name} gets ${c.amount} coins.`;
    case 'help': return 'Your friend is having a tough day. How will you help?';
    case 'path': return 'Choose your path. Go to college, or start working?';
    case 'career': return 'Career day!';
    case 'home': return 'Find a home. Where do you want to live?';
    case 'finish': return `${p.name} made it to the Life Party!`;
  }
  return '';
}
function readCard() {
  if (!('speechSynthesis' in window)) { toast('Read-aloud isn\'t supported in this browser.'); return; }
  speechCancel();
  const u = new SpeechSynthesisUtterance(cardSpeech().replace(/[“”]/g, ''));
  u.rate = 0.95;
  window.speechSynthesis.speak(u);
}
function speechCancel() {
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
}

let toastTimer = null;
function toast(msg) {
  S.toast = msg;
  renderToast();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { S.toast = null; renderToast(); }, 2600);
}

let actx = null;
const audio = () => (actx = actx || new (window.AudioContext || window.webkitAudioContext)());

// A short wooden "tock", like setting a game piece down on a board.
function woodClick(t) {
  const ctx = audio();
  const len = Math.floor(ctx.sampleRate * 0.03);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 4);
  const noise = ctx.createBufferSource();
  noise.buffer = buf;
  const band = ctx.createBiquadFilter();
  band.type = 'bandpass';
  band.frequency.value = 1800;
  band.Q.value = 1.2;
  const ng = ctx.createGain();
  ng.gain.value = 0.9;
  noise.connect(band).connect(ng).connect(ctx.destination);
  noise.start(t);
  // A little low "body" so it sounds like wood rather than static.
  const osc = ctx.createOscillator();
  const og = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(260, t);
  osc.frequency.exponentialRampToValueAtTime(120, t + 0.05);
  og.gain.setValueAtTime(0.35, t);
  og.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
  osc.connect(og).connect(ctx.destination);
  osc.start(t);
  osc.stop(t + 0.07);
}

// One click per space moved, so a jump sounds like the piece tapping across the board.
let clicksEnd = 0;
function pieceClicks(n) {
  if (!S.sound || n <= 0) return;
  try {
    const t0 = audio().currentTime + 0.01;
    const count = Math.min(n, 10);
    for (let k = 0; k < count; k++) woodClick(t0 + k * 0.12);
    clicksEnd = t0 + count * 0.12;
  } catch (e) { /* audio is optional */ }
}

function sfx(kind) {
  if (!S.sound) return;
  const tunes = {
    pop: [[520, 0.08], [700, 0.1]],
    good: [[523, 0.09], [784, 0.14]],
    nope: [[330, 0.12], [262, 0.18]],
    spin: [[400, 0.05], [500, 0.05], [600, 0.05]],
    yay: [[523, 0.1], [659, 0.1], [784, 0.1], [1047, 0.25]],
  };
  try {
    audio();
    let t = Math.max(actx.currentTime + 0.01, clicksEnd);
    for (const [f, d] of tunes[kind] || []) {
      const osc = actx.createOscillator();
      const g = actx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = f;
      g.gain.setValueAtTime(0.15, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + d);
      osc.connect(g).connect(actx.destination);
      osc.start(t);
      osc.stop(t + d + 0.02);
      t += d * 0.9;
    }
  } catch (e) { /* audio is optional */ }
}

/* =========================================================
   INPUT
   ========================================================= */

document.addEventListener('input', ev => {
  const m = /^name(\d)$/.exec(ev.target.id || '');
  if (m) S.setup.names[Number(m[1])] = ev.target.value;
});

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const a = el.dataset.action;
  const i = el.dataset.i != null ? Number(el.dataset.i) : null;
  const c = S.card;

  switch (a) {
    // setup
    case 'count': S.setup.count = i; break;
    case 'avatar': {
      const used = S.setup.avatars.filter((_, k) => k !== i && k < S.setup.count);
      let next = S.setup.avatars[i];
      do { next = (next + 1) % AVATARS.length; } while (used.includes(next));
      S.setup.avatars[i] = next;
      break;
    }
    case 'length': S.setup.spinMax = i; break;
    case 'start': startGame(); return;

    // turn
    case 'spin': spin(); return;
    case 'hop': hop(i); return;
    case 'choose': chooseSocial(i); break;
    case 'redraw': c.data = drawSocial(cur().pos); c.order = shuffle([0, 1, 2]); if (S.autoRead) readCard(); break;
    case 'redraw-share': c.q = drawFrom('share', SHARE); if (S.autoRead) readCard(); break;
    case 'talked': talked(i); break;
    case 'friend': c.friend = i; break;
    case 'help-way': chooseHelp(el.dataset.id); break;
    case 'coping': chooseCoping(i); break;
    case 'guide': if (guideTimer) { stopGuide(); el.textContent = '▶ Start guided breathing'; document.getElementById('breathLabel').textContent = 'Stopped. Tap Start to try again.'; } else startGuide(); return;
    // These update the button in place so a running guided-breathing circle isn't interrupted.
    case 'did-it':
    case 'together':
    case 'showed': {
      const key = a === 'did-it' ? 'didIt' : a;
      if (c[key]) return;
      c[key] = true;
      if (a === 'together') S.players.forEach(o => { if (o !== cur()) applyFx(o, 0, 1); });
      else applyFx(cur(), 0, 1);
      sfx(a === 'together' ? 'yay' : 'good');
      el.disabled = true;
      el.classList.add('btn-go');
      el.textContent = a === 'together' ? '✅ Everyone +1 ❤️' : a === 'did-it' ? '✅ Done! +1 ❤️' : '✅ Shown! +1 ❤️';
      renderSide();
      return;
    }
    case 'path': choosePath(el.dataset.id); break;
    case 'career': chooseCareer(i); break;
    case 'home': chooseHome(i); break;
    case 'done': stopGuide(); endTurn(); return;
    case 'read': readCard(); return;

    // top bar
    case 'toggle-read': S.autoRead = !S.autoRead; if (!S.autoRead) speechCancel(); break;
    case 'toggle-sound': S.sound = !S.sound; break;
    case 'help': S.modal = { type: 'help' }; break;
    case 'close-modal': S.modal = null; break;
    case 'end-game': S.modal = { type: 'confirm-end' }; break;
    case 'really-end': stopGuide(); S.modal = null; S.card = null; S.phase = 'party'; speechCancel(); sfx('yay'); break;
    case 'new-game': S.modal = S.phase === 'setup' || S.phase === 'party' ? null : { type: 'confirm-new' }; if (S.phase === 'party') { S.phase = 'setup'; S.players = []; } break;
    case 'really-new': stopGuide(); S.modal = null; S.card = null; S.phase = 'setup'; S.players = []; speechCancel(); break;
  }
  if (S.autoRead && c && S.card === c && ['choose', 'help-way', 'path', 'career', 'home', 'coping'].includes(a)) readCard();
  renderAll();
});

document.addEventListener('keydown', ev => {
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.id === 'wheelBtn') {
    ev.preventDefault();
    spin();
    return;
  }
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.dataset && ev.target.dataset.action === 'hop') {
    ev.preventDefault();
    hop(Number(ev.target.dataset.i));
    const nxt = document.querySelector('.cell.next');
    if (nxt) nxt.focus();
    return;
  }
  if (ev.key === 'Escape' && S.modal) { S.modal = null; renderAll(); }
});

buildWheel();
renderAll();
</script>
</body>
</html>
