  // Resolves only if the same game is still running, so a game that was reset
  // mid-roll never resumes against the new state.
  const wait = ms => { const g = S; return new Promise(r => setTimeout(() => { if (S === g) r(); }, ms)); };

  let S = null;
  function newState(mode) {
    return {
      mode,                                   // 'race' | 'team'
      cur: 0,
      players: [{ parts: {}, tokens: 0 }, { parts: {}, tokens: 0 }],
      chart: [BODY, HEAD, EYES, LEGS, NOSE, HAT, ARMS, STAR],   // chart[face-1] = part id
      rolls: 0,
      // Swap happens twice a game: first from spin 4-6, then 4-6 spins after
      // the first one, each time once both critters share a kind of part.
      swapAt: 4 + rand(3),
      swapsDone: 0,
      owl: OWL_ROUNDS,
      phase: 'roll',                          // 'roll' | 'pick' | 'busy' | 'done' | 'over'
      shown: [0, 3],                          // faces (0-5) under the gold and pink pointers
      angle: 0,                               // wheel rotation in degrees
      revealed: false,                        // true once the dice have landed this turn
      chosen: null,                           // index of the die the player took
      special: null,                          // 'swap' while a Swap spin is showing
      over: false,
    };
  }

  const other = i => 1 - i;
  const has = (pi, p) => S.players[pi].parts[p] != null;
  const canAdd = (pi, p) => p === STAR ? addable(pi).length > 0 : !has(pi, p) && NEEDS[p].every(q => has(pi, q));
  const complete = pi => PART_NAMES.every((_, p) => has(pi, p));
  const addable = pi => PART_NAMES.map((_, p) => p).filter(p => canAdd(pi, p));
  // Team mode: once your critter is done you help your partner instead.
  const targetFor = pi => (S.mode === 'team' && complete(pi)) ? other(pi) : pi;
  const swapTypes = () => PART_NAMES.map((_, p) => p)
    .filter(p => has(0, p) && has(1, p) && S.players[0].parts[p] !== S.players[1].parts[p]);

  // ================================================================
  // Rendering
  // ================================================================
  const panels = [$('#panel0'), $('#panel1')];

  function renderChart() {
    const chart = $('#chart');
    if (!chart.children.length) {
      for (let f = 0; f < WEDGES; f++) {
        const t = document.createElement('div');
        t.className = 'tile';
        t.style.setProperty('--wf', WEDGE_FILL[f]);
        t.innerHTML = `<div class="face">${spotSVG(f + 1)}</div>
          <svg class="eq" viewBox="0 0 20 20"><path d="M2 6H18M2 14H18" stroke="${INK}" stroke-width="4" stroke-linecap="round"/></svg>
          <div class="icon"></div><div class="tbadge check">${CHECK}</div><div class="tbadge lock">${LOCK}</div>`;
        chart.appendChild(t);
      }
    }
    [...chart.children].forEach((t, f) => {
      t.querySelector('.icon').innerHTML = iconSVG(S.chart[f]);
      t.setAttribute('aria-label', `${f + 1} = ${LABEL[S.chart[f]]}`);
    });
    updateChartState();
  }
  // Mark chart parts the current player already has (check) or can't add yet (lock).
  function updateChartState() {
    const pi = S && !S.over ? targetFor(S.cur) : null;
    [...$('#chart').children].forEach((t, f) => {
      const p = S ? S.chart[f] : 0;
      t.classList.toggle('have', pi != null && has(pi, p));
      t.classList.toggle('locked', pi != null && !has(pi, p) && !canAdd(pi, p));
    });
  }

  function renderPanel(pi, popPart, newToken) {
    const pan = panels[pi], pl = S.players[pi];
    pan.querySelector('.stage').innerHTML = critterSVG(pl.parts, popPart);
    const tag = pan.querySelector('.nameTag'), badge = chosenBadges[pi];
    tag.hidden = !badge;
    if (badge) {
      tag.style.background = badge.color;
      tag.innerHTML = `${badge.icon}<span></span>`;
      tag.querySelector('span').textContent = badge.name;
    }
    pan.querySelector('.progress').innerHTML = PART_NAMES.map((n, p) =>
      `<div class="pi${has(pi, p) ? ' got' : ''}" aria-label="${n}">${iconSVG(p)}</div>`).join('');
    let toks = '';
    for (let i = 0; i < MAX_TOKENS; i++) toks += tokenSVG(i < pl.tokens);
    const tokens = pan.querySelector('.tokens');
    tokens.innerHTML = toks;
    tokens.setAttribute('aria-label', `${pl.tokens} of ${MAX_TOKENS} spare parts`);
    if (newToken === 'new' && pl.tokens > 0) tokens.children[pl.tokens - 1].classList.add('new');
    if (newToken === 'full') [...tokens.querySelectorAll('.tok')].forEach(t => t.classList.add('full'));
    updateChartState();
  }

  function renderTurn() {
    const col = `var(--p${S.cur})`;
    const badge = $('#turnBadge');
    badge.textContent = S.cur + 1;
    badge.style.background = col;
    badge.setAttribute('aria-label', `${poss(S.cur)} turn`);
    badge.classList.remove('flip'); void badge.offsetWidth; badge.classList.add('flip');
    panels.forEach((p, i) => {
      p.classList.toggle('active', i === S.cur && !S.over);
      p.classList.toggle('idle', i !== S.cur && !S.over);
    });
    updateControls();
  }

  function updateControls() {
    $('#wheel').classList.toggle('ready', S.phase === 'roll');
    const me = S.cur;
    const canCog = S.phase === 'roll' && S.players[me].tokens >= MAX_TOKENS && addable(targetFor(me)).length > 0;
    const cb = $('#cogBtn');
    cb.classList.toggle('show', canCog);
    const nb = $('#nextBtn'), nxt = other(me);
    nb.hidden = S.phase !== 'done';
    $('#spinRow').hidden = !$('#dice').hidden || S.phase === 'done';
    nb.style.background = `var(--p${nxt})`;
    nb.innerHTML = `${ARROW}Go, ${nm(nxt)}!`;
    nb.setAttribute('aria-label', `Start ${poss(nxt)} turn`);
    setCoach(coachText());
  }

  // ---- Coach line ----
  const listParts = ps => {
    const w = ps.map(p => A_PART[p]);
    return w.length < 2 ? w.join('') : w.slice(0, -1).join(', ') + ' or ' + w[w.length - 1];
  };
  const fitsWord = p => PLURAL.has(p) ? 'fit' : 'fits';
  const theName = p => `The ${LABEL[p]}`;
  const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
  function needText(pi) {
    if (!has(pi, BODY)) return 'You need a body first.';
    const a = addable(pi);
    if (!has(pi, HEAD)) {
      const others = a.filter(p => p !== HEAD);
      return others.length ? `Next you need a head! ${cap(listParts(others))} fit too.` : 'Next you need a head!';
    }
    return a.length ? `Next you need ${listParts(a)}!` : '';
  }
  function coachText() {
    if (!S || S.over) return null;
    const me = S.cur, partner = other(me), n = `${nm(me)}`, team = S.mode === 'team';
    const giftOnly = team && complete(me);
    switch (S.phase) {
      case 'roll': {
        if (giftOnly) return `${n}, your critter is done! Tap the spinner to find a gift for ${nm(partner)}.`;
        const cogs = $('#cogBtn').classList.contains('show') ? ' Or use your 3 cogs to pick any part!' : '';
        return `${n}, tap the spinner! ${needText(me)}${cogs}`;
      }
      case 'spinning': return 'Round and round... wait for it to stop!';
      case 'pick': {
        const [a, b] = S.shown.map(f => S.chart[f]);
        const giving = giftOnly || S.giftPick;
        const who = giving ? partner : me;
        const fa = canAdd(who, a), fb = canAdd(who, b);
        if (giving) return `Tap a gift for ${nm(partner)}!`;
        const gift = team ? ` The other is a gift for ${nm(partner)}.` : '';
        if (fa && fb && a !== b) return `Both fit! Pick one.${gift}`;
        const p = fa ? a : b;
        return `${theName(p)} ${fitsWord(p)}! Tap ${PLURAL.has(p) ? 'them' : 'it'}.${gift}`;
      }
      case 'done': return team
        ? `Nice! The owl closes its eyes a little. Tap Go for ${poss(partner)} turn.`
        : `Nice! Tap Go for ${poss(partner)} turn.`;
      default: return null;      // keep the current line while a card is open
    }
  }
  function setCoach(text) {
    if (text == null) return;
    const c = $('#coach');
    const col = S && !S.over ? `var(--p${S.cur})` : '#7B4DFF';
    const html = `<span class="chip" style="background:${col}"></span><span>${text}</span>`;
    if (c.innerHTML === html) return;
    c.innerHTML = html;
    c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop');
  }

  let owlId = 0;
  function owlSVG(remaining) {
    const s = 1 - remaining / OWL_ROUNDS;
    const uid = ++owlId;             // 0 = wide awake, 1 = asleep
    const lid = (cy, id) => `<clipPath id="${id}"><circle cx="${cy[0]}" cy="${cy[1]}" r="17"/></clipPath>
      <rect clip-path="url(#${id})" x="${cy[0] - 18}" y="${cy[1] - 18}" width="36" height="${(36 * s).toFixed(1)}" fill="#9A6847"/>`;
    const asleep = remaining <= 0;
    return `
      <path d="M28 36 L22 8 L46 26 Z M92 36 L98 8 L74 26 Z" fill="#9A6847" ${O}/>
      <ellipse cx="60" cy="68" rx="44" ry="48" fill="#9A6847" ${O}/>
      <ellipse cx="60" cy="86" rx="26" ry="26" fill="#F3DDB8"/>
      <path d="M48 80 q6 6 12 0 q6 6 12 0 M48 94 q6 6 12 0 q6 6 12 0" fill="none" stroke="#CDA77A" stroke-width="3"/>
      <circle cx="42" cy="52" r="17" fill="#fff" ${O}/><circle cx="78" cy="52" r="17" fill="#fff" ${O}/>
      ${asleep ? '' : `<circle cx="42" cy="54" r="7" fill="${INK}"/><circle cx="78" cy="54" r="7" fill="${INK}"/>`}
      ${lid([42, 52], 'owlL' + uid)}${lid([78, 52], 'owlR' + uid)}
      ${asleep ? `<path d="M30 54 Q42 62 54 54 M66 54 Q78 62 90 54" fill="none" ${O}/>` : ''}
      <circle cx="42" cy="52" r="17" fill="none" ${O}/><circle cx="78" cy="52" r="17" fill="none" ${O}/>
      <path d="M54 64 L66 64 L60 76 Z" fill="#FFA000" ${O}/>
      ${asleep ? `<text x="96" y="22" font-size="22" font-weight="900" fill="#6B6F8E">z</text><text x="104" y="8" font-size="16" font-weight="900" fill="#6B6F8E">z</text>` : ''}`;
  }
  function renderOwl(tick) {
    $('#owlBox').classList.toggle('show', S.mode === 'team');
    if (S.mode !== 'team') return;
    const owl = $('#owl');
    owl.innerHTML = owlSVG(S.owl);
    if (tick) { owl.classList.remove('tick'); void owl.offsetWidth; owl.classList.add('tick'); }
    let m = '';
    for (let i = 0; i < OWL_ROUNDS; i++) m += `<div class="moon${i >= S.owl ? ' gone' : ''}"></div>`;
    $('#moons').innerHTML = m;
  }

  function renderAll() {
    renderChart();
    renderPanel(0); renderPanel(1);
    renderWheel(); renderDice();
    renderOwl(false);
    renderTurn();
  }

  // ================================================================
  // Overlays
  // ================================================================
  // Show 3 previews of the target critter, each with one version of the part.
  function pickVersion(target, part, helper) {
    return new Promise(resolve => {
      const ov = $('#picker');
      const card = ov.querySelector('.card');
      card.style.borderColor = `var(--p${target})`;
      ov.querySelector('.cardTitle').textContent = helper
        ? `Pick ${A_PART[part]} for ${nm(target)}!`
        : `${nm(target)}, pick the ${PART_NAMES[part]} you like best!`;
      ov.querySelector('.cardHead').innerHTML = iconSVG(part) +
        (helper ? `<svg viewBox="0 0 100 100"><path d="M50 86 C10 58 10 22 32 20 C42 19 48 26 50 32 C52 26 58 19 68 20 C90 22 90 58 50 86Z" fill="#FF3B30" ${O}/></svg>` : '');
      const opts = ov.querySelector('.opts');
      opts.innerHTML = '';
      // Show 3 versions picked at random from all of this part's versions.
      const pool = ART[part].map((_, v) => v);
      for (let k = pool.length - 1; k > 0; k--) { const j = rand(k + 1); [pool[k], pool[j]] = [pool[j], pool[k]]; }
      for (const v of pool.slice(0, 3)) {
        const b = document.createElement('button');
        b.className = 'opt';
        b.setAttribute('aria-label', `${PART_NAMES[part]} ${v + 1}`);
        b.innerHTML = critterSVG({ ...S.players[target].parts, [part]: v }, part);
        b.onclick = () => { ov.classList.remove('show'); resolve(v); };
        opts.appendChild(b);
      }
      ov.classList.add('show');
    });
  }

  // Choose a part type from icons. Resolves to the part id, or null for "no thanks".
  function chooseType(types, headSVG, color, allowSkip = true, title = '') {
    return new Promise(resolve => {
      const ov = $('#chooser');
      ov.querySelector('.cardTitle').textContent = title;
      ov.querySelector('.card').style.borderColor = color;
      ov.querySelector('.cardHead').innerHTML = headSVG;
      const opts = ov.querySelector('.opts');
      opts.innerHTML = '';
      types.forEach(p => {
        const b = document.createElement('button');
        b.className = 'opt small';
        b.setAttribute('aria-label', PART_NAMES[p]);
        b.innerHTML = iconSVG(p);
        b.onclick = () => { ov.classList.remove('show'); resolve(p); };
        opts.appendChild(b);
      });
      const x = ov.querySelector('.xBtn');
      x.innerHTML = `<svg viewBox="0 0 100 100"><path d="M20 20 L80 80 M80 20 L20 80" stroke="#fff" stroke-width="18" stroke-linecap="round"/></svg>`;
      x.style.display = allowSkip ? '' : 'none';
      x.onclick = () => { ov.classList.remove('show'); resolve(null); };
      ov.classList.add('show');
    });
  }

  // Big "what happened" card. Waits for the player to tap OK (or anywhere).
  function showResult(html, color) {
    const g = S;
    return new Promise(res => {
      const ov = $('#result'), card = ov.querySelector('.card');
      card.innerHTML = html + `<button class="okBtn">${CHECK}OK</button>`;
      card.style.borderColor = color;
      ov.classList.add('show');
      let done = false;
      const fin = () => {
        if (done) return;
        done = true;
        ov.classList.remove('show');
        if (S === g) res();
      };
      ov.onclick = fin;
    });
  }

  function flash(inner) {
    const f = $('#flash');
    f.innerHTML = inner;
    f.classList.remove('show'); void f.getBoundingClientRect(); f.classList.add('show');
  }

  // ================================================================
  // Turn flow
  // ================================================================
  async function addPart(target, part, helper) {
    const v = await pickVersion(target, part, helper);
    S.players[target].parts[part] = v;
    sfx.pop();
    renderPanel(target, part);
    return checkEnd();
  }

  function giveToken(target) {
    const pl = S.players[target];
    if (pl.tokens < MAX_TOKENS) { pl.tokens++; sfx.token(); renderPanel(target, null, 'new'); }
    else { sfx.nope(); renderPanel(target, null, 'full'); }
  }

  // ---- Spinner ----
  const WEDGE_PATH = (() => {
    const r = 100, a = Math.PI / WEDGES, x = (r * Math.sin(a)).toFixed(2), y = (-r * Math.cos(a)).toFixed(2);
    return `M0 0 L${-x} ${y} A${r} ${r} 0 0 1 ${x} ${y} Z`;
  })();
  // Face under the gold (top) pointer for a wheel turned `angle` degrees clockwise.
  const faceAt = angle => ((Math.round(-angle / STEP) % WEDGES) + WEDGES) % WEDGES;
  function renderWheel() {
    const lit = S && S.revealed ? S.shown : [];
    let g = '';
    for (let f = 0; f < WEDGES; f++) {
      const p = S ? S.chart[f] : f;
      const cls = !lit.includes(f) ? '' : (lit[0] === f || p === STAR) ? ' lit0' : ' lit1';
      g += `<g transform="rotate(${f * STEP})" class="wedge${cls}">
        <path d="${WEDGE_PATH}" fill="${WEDGE_FILL[f]}" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>
        <g class="up" data-f="${f}" data-cy="-72"><svg x="-21" y="-93" width="42" height="42" viewBox="0 0 100 100">${ICON[p]}</svg></g>
        <g class="up" data-f="${f}" data-cy="-41"><text x="0" y="-33" text-anchor="middle" font-size="22" font-weight="700" fill="${INK}" font-family="system-ui, sans-serif">${f + 1}</text></g>
      </g>`;
    }
    $('#wheel').innerHTML = `<g id="wheelRot" transform="rotate(${S ? S.angle : 0})">${g}</g>
      <circle r="100" fill="none" stroke="${INK}" stroke-width="7"/>
      <circle r="24" fill="#FFE000" stroke="${INK}" stroke-width="5"/>
      <text class="hubLabel" x="0" y="5" text-anchor="middle" font-size="14" font-weight="800" fill="${INK}" font-family="system-ui, sans-serif">SPIN</text>
      <path d="M-16 -123 L16 -123 L0 -90 Z" fill="#FFE000" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>
      <path d="M-16 123 L16 123 L0 90 Z" fill="#FF8CC0" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>`;
    setWheel(S ? S.angle : 0);
  }
  // Turn the wheel, keeping each wedge's icon and number upright so they stay readable.
  function setWheel(angle) {
    const rot = $('#wheelRot');
    if (!rot) return;
    rot.setAttribute('transform', `rotate(${angle})`);
    rot.querySelectorAll('.up').forEach(u =>
      u.setAttribute('transform', `rotate(${-(+u.dataset.f * STEP + angle)} 0 ${u.dataset.cy})`));
  }

  // fits / have / locked, for part p on critter pi
  const fitBadge = (pi, p) => canAdd(pi, p) ? CHECK : has(pi, p) ? CROSS : LOCK;

  function renderDice() {
    const box = $('#dice');
    const showChoices = !!(S.revealed || S.special);
    box.hidden = !showChoices;
    $('#spinRow').hidden = showChoices;
    box.classList.toggle('single', !!S.special);
    if (S.special) {
      box.innerHTML = `<div class="dieChoice" aria-label="Swap"><div class="dface">${spotSVG(S.special)}</div></div>`;
      return;
    }
    const me = S.cur, partner = other(me), team = S.mode === 'team';
    // Giving only: your critter is done, or nothing fit you this spin.
    const giftOnly = team && (complete(me) || !!S.giftPick);
    // When one part fits, the other can't be tapped: a mis-tap shouldn't cost a turn.
    const fitsWho = giftOnly ? partner : me;
    const anyFits = S.revealed && S.shown.some(f => canAdd(fitsWho, S.chart[f]));
    box.innerHTML = '';
    S.shown.forEach((f, i) => {
      const part = S.chart[f];
      const blocked = anyFits && !canAdd(fitsWho, part);
      const b = document.createElement('button');
      let cls = 'dieChoice';
      if (S.phase === 'pick') cls += blocked ? ' pickable blocked' : ' pickable';
      if (part === STAR) cls += ' starChoice';
      if (S.chosen != null) cls += i === S.chosen ? (giftOnly ? ' giftDie' : ' chosen') : (team && !giftOnly ? ' giftDie' : ' faded');
      b.className = cls;
      b.disabled = S.phase !== 'pick';
      let inner = `<div class="dface">${spotSVG(f + 1)}</div>`;
      if (S.revealed) {
        const who = giftOnly ? partner : me;
        inner += `<div class="dpart">${iconSVG(part)}<div class="dbadge">${fitBadge(who, part)}</div></div>`;
        if (team) inner += `<div class="dgift">${HEART}${giftOnly ? '' : fitBadge(partner, part)}</div>`;
        b.setAttribute('aria-label', `${i ? 'Pink' : 'Gold'} pointer: ${LABEL[part]}`);
      } else {
        inner += `<div class="dpart empty"></div>`;
        b.setAttribute('aria-label', `${i ? 'Pink' : 'Gold'} pointer`);
      }
      b.innerHTML = inner;
      b.onclick = () => pickDie(i);
      box.appendChild(b);
    });
  }
  function highlightTiles(faces) {
    [...$('#chart').children].forEach((t, f) => {
      const star = S && S.chart[f] === STAR;
      t.classList.toggle('hl0', faces[0] === f || (star && faces.includes(f)));
      t.classList.toggle('hl1', faces[1] === f && faces[0] !== f && !star);
    });
  }

  // Tap the wheel: it gets a random push and slows to a stop on its own.
  async function spin() {
    if (!S || S.over || S.phase !== 'roll') return;
    const g = S;
    g.phase = 'spinning'; g.revealed = false; g.chosen = null; g.special = null; g.giftPick = false;
    g.rolls++;
    highlightTiles([]);
    renderWheel(); renderDice(); updateControls();
    sfx.whoosh();
    // Pick where it stops (inside a wedge, never on a line), then slow down
    // to it at a steady rate, like a real spinner.
    const T = 1800 + Math.random() * 700;                   // ms (about 2 seconds)
    const from = g.angle;
    const roughEnd = from + (0.7 + Math.random() * 0.4) * T / 2;
    const end = Math.round(roughEnd / STEP) * STEP + (Math.random() * 0.6 - 0.3) * STEP;
    const D = end - from, v0 = 2 * D / T;
    let lastWedge = Math.floor((from + STEP / 2) / STEP);
    await new Promise(res => {
      let t0 = null;
      const step = t => {
        if (S !== g) return;
        if (t0 == null) t0 = t;
        const e = Math.min(t - t0, T);
        g.angle = from + v0 * e - (v0 / T) * e * e / 2;
        setWheel(g.angle);
        const w = Math.floor((g.angle + STEP / 2) / STEP);
        if (w !== lastWedge) { lastWedge = w; sfx.tick(); }
        if (e < T) requestAnimationFrame(step); else res();
      };
      requestAnimationFrame(step);
    });
    g.phase = 'busy'; updateControls();
    const top = faceAt(g.angle);
    await wait(250);

    if (g.swapsDone < 2 && g.rolls >= g.swapAt && swapTypes().length) {
      g.swapsDone++;
      g.swapAt = g.rolls + 4 + rand(3);
      g.special = 'swap';
      sfx.swap(); flash(spotInner('swap'));
      renderDice();
      await wait(600);
      const p = await chooseType(swapTypes(), `<svg viewBox="0 0 100 100">${spotInner('swap')}</svg>`, `var(--p${g.cur})`, true,
        `Swap! Pick a part to trade with ${nm(other(g.cur))}, or tap X to skip.`);
      if (p != null) {
        const [a, b] = [g.players[0].parts[p], g.players[1].parts[p]];
        g.players[0].parts[p] = b; g.players[1].parts[p] = a;
        sfx.swap();
        renderPanel(0, p); renderPanel(1, p);
        await wait(550);
      }
      return endTurn();
    }

    // Normal stop: the two pointed-at parts become the choices.
    g.shown = [top, (top + WEDGES / 2) % WEDGES];
    g.revealed = true; g.phase = 'pick';
    highlightTiles(g.shown);
    // Sound tells the result: a happy chime if something fits, a sad trombone if nothing does.
    const me = g.cur, partner = other(me), team = g.mode === 'team';
    const giftOnly = team && complete(me);
    const parts = g.shown.map(f => g.chart[f]);
    const fitsFor = pi => parts.some(p => canAdd(pi, p));
    const who = giftOnly ? partner : me;
    if (fitsFor(who)) { sfx.yay(); renderWheel(); renderDice(); updateControls(); return; }

    sfx.sad();
    g.phase = 'busy';
    renderWheel(); renderDice(); updateControls();
    setCoach(giftOnly ? `Neither one fits ${nm(partner)}.` : 'Neither one fits.');
    await wait(700);
    if (giftOnly) {
      await showResult(neitherCard(parts, `Neither one fits ${nm(partner)}. They get a spare part!`), `var(--p${partner})`);
      giveToken(partner);
    } else if (team && fitsFor(partner)) {
      // Nothing for you, but your teammate can use one: you get a cog, then pick their gift.
      await showResult(neitherCard(parts, 'Neither one fits you. You get a spare part!'), `var(--p${me})`);
      giveToken(me);
      await wait(400);
      g.giftPick = true; g.phase = 'pick';
      renderDice(); updateControls();
      return;
    } else {
      await showResult(neitherCard(parts, team ? 'Neither one fits. You both get a spare part!' : 'Neither one fits. You get a spare part!'), `var(--p${me})`);
      giveToken(me);
      if (team) giveToken(partner);
    }
    await wait(500);
    endTurn();
  }

  // "Neither one fits" card: both parts crossed out, then a cog.
  function neitherCard(parts, text) {
    return `<div class="rrow">${parts.map(p => `<div class="rpart">${iconSVG(p)}<div class="rbadge">${CROSS}</div></div>`).join('')}</div>
      <div class="rcap">${text.replace('. ', '.<br>')}</div><div class="rrow small"><span class="rplus">+</span>${gearMini}</div>`;
  }

  // Use die i. In Team mode the other die is a gift for the teammate.
  async function pickDie(i) {
    if (!S || S.phase !== 'pick') return;
    const giving = S.mode === 'team' && (complete(S.cur) || S.giftPick);
    const who = giving ? other(S.cur) : S.cur;
    const fits = f => canAdd(who, S.chart[f]);
    if (S.shown.some(fits) && !fits(S.shown[i])) return;   // not an option while the other one fits
    S.phase = 'busy'; S.chosen = i;
    renderDice(); updateControls();
    const me = S.cur, partner = other(me);
    const mine = S.chart[S.shown[i]], gift = S.chart[S.shown[1 - i]];
    if (S.giftPick || (S.mode === 'team' && complete(me))) {
      S.giftPick = false;
      if (await usePart(partner, mine, true, S.shown[i])) return;
    } else {
      if (await usePart(me, mine, false, S.shown[i])) return;
      if (S.mode === 'team') {
        await wait(250);
        if (await usePart(partner, gift, true, S.shown[1 - i])) return;
      }
    }
    endTurn();
  }

  // Put `part` on critter `target`, or explain why not and give a spare part.
  // Returns true if the game ended.
  async function usePart(target, part, gift, face) {
    const color = `var(--p${target})`;
    const top = `<div class="rrow">${spotSVG(face + 1)}${ARROW}<div class="rpart">${iconSVG(part)}<div class="rbadge">%BADGE%</div></div>${gift ? HEART : ''}</div>`;
    if (canAdd(target, part)) {
      if (gift) await showResult(top.replace('%BADGE%', CHECK) + `<div class="rcap">A gift for ${nm(target)}!</div>`, color);
      if (part === STAR) {
        part = await chooseType(addable(target), iconSVG(STAR), color, false,
          gift ? `Star! Pick any part for ${nm(target)}.` : 'Star! Pick any part you need.');
      }
      if (await addPart(target, part, gift)) return true;
      await wait(400);
      return false;
    }
    const full = S.players[target].tokens >= MAX_TOKENS;
    const text = gift
      ? `That doesn't fit ${nm(target)} yet.${full ? '' : ' They get a spare part!'}`
      : `That one doesn't fit yet.${full ? '' : ' You get a spare part!'}`;
    const cog = full ? `<div class="rcap">Cogs are full. Use them!</div>` : `<div class="rrow small"><span class="rplus">+</span>${gearMini}</div>`;
    await showResult(top.replace('%BADGE%', CROSS) + `<div class="rcap">${text}</div>` + cog, color);
    giveToken(target);
    await wait(500);
    return false;
  }

  // 3 spare parts -> any part. Chosen by the player before rolling; they still roll after.
  async function useCogs() {
    if (!S || S.phase !== 'roll') return;
    const me = S.cur, target = targetFor(me);
    const types = addable(target);
    if (S.players[me].tokens < MAX_TOKENS || !types.length) return;
    S.phase = 'busy'; updateControls();
    const p = await chooseType(types, `${gearMini}${gearMini}${gearMini}`, `var(--p${target})`, true,
      'Trade 3 cogs for any part. Which part do you need?');
    if (p == null) { S.phase = 'roll'; updateControls(); return; }
    S.players[me].tokens -= MAX_TOKENS;
    renderPanel(me);
    if (await addPart(target, p, target !== me)) return;
    S.phase = 'roll';
    renderPanel(0); renderPanel(1);
    updateControls();
  }

  function endTurn() {
    if (S.over) return;
    highlightTiles([]);
    if (S.mode === 'team') {
      S.owl--;
      renderOwl(true);
      if (S.owl <= 0) { sfx.owl(); return endGame('sleep'); }
    }
    // Wait here until someone taps the next-player button.
    S.phase = 'done'; S.revealed = false; S.chosen = null; S.special = null;
    renderWheel(); renderDice();
    renderPanel(0); renderPanel(1);
    updateControls();
  }

  function nextTurn() {
    if (!S || S.phase !== 'done') return;
    S.cur = other(S.cur);
    S.phase = 'roll';
    sfx.turn();
    renderPanel(0); renderPanel(1);
    renderTurn();
    offerCogs();
  }

  const canUseCogs = () => S && S.phase === 'roll' && S.players[S.cur].tokens >= MAX_TOKENS && addable(targetFor(S.cur)).length > 0;

  // With 3 cogs at the start of a turn, ask straight away so they don't go unused.
  async function offerCogs() {
    if (!canUseCogs()) return;
    const g = S, me = g.cur;
    sfx.token();
    const yes = await new Promise(res => {
      const ov = $('#result'), card = ov.querySelector('.card');
      card.style.borderColor = `var(--p${me})`;
      card.innerHTML = `<div class="rrow small">${gearMini}${gearMini}${gearMini}${ARROW}${questionIcon}</div>
        <div class="rcap">${nm(me)}, you have 3 spare parts!<br>Use them to pick any part?</div>
        <div class="rrow"><button type="button" class="okBtn" data-yes="1">${CHECK}Pick a part</button>
        <button type="button" class="okBtn later">Not now</button></div>`;
      ov.onclick = null;
      card.querySelectorAll('button').forEach(b => b.onclick = e => {
        e.stopPropagation();
        ov.classList.remove('show');
        res(!!b.dataset.yes);
      });
      ov.classList.add('show');
    });
    if (S !== g) return;
    if (yes) useCogs();
  }

  // Returns true if the game ended.
  function checkEnd() {
    if (S.mode === 'race') {
      for (const pi of [0, 1]) if (complete(pi)) { endGame('race', pi); return true; }
    } else if (complete(0) && complete(1)) { endGame('team'); return true; }
    return false;
  }

  const trophySVG = `<svg viewBox="0 0 100 100" class="big">
      <path d="M28 14 H72 V40 C72 56 62 64 50 64 C38 64 28 56 28 40 Z" fill="#FFE000" ${O}/>
      <path d="M28 22 H14 C14 40 22 46 30 46 M72 22 H86 C86 40 78 46 70 46" fill="none" ${O}/>
      <rect x="44" y="64" width="12" height="14" fill="#FFE000" ${O}/><rect x="30" y="78" width="40" height="12" rx="3" fill="#FFE000" ${O}/>
      <path d="M50 24 l4 8 9 1 -7 6 2 9 -8 -5 -8 5 2 -9 -7 -6 9 -1 Z" fill="#fff"/></svg>`;
  const starSVG = (c) => `<path d="M50 6 L62 36 L94 38 L69 58 L77 90 L50 72 L23 90 L31 58 L6 38 L38 36 Z" fill="${c}" ${O}/>`;
  const crownSVG = `<svg viewBox="0 0 120 100" class="crown"><path d="M12 82 L6 24 L36 50 L60 10 L84 50 L114 24 L108 82 Z" fill="#FFE000" ${O}/>
      <circle cx="60" cy="62" r="9" fill="#FF4FA3" ${O}/><circle cx="32" cy="66" r="7" fill="#1F8CFF" ${O}/><circle cx="88" cy="66" r="7" fill="#00E07A" ${O}/></svg>`;

  function endGame(kind, winner) {
    S.over = true; S.phase = 'over';
    $('#picker').classList.remove('show'); $('#chooser').classList.remove('show'); $('#result').classList.remove('show');
    document.body.classList.add('over');
    panels.forEach(p => { p.classList.remove('active', 'idle'); p.classList.add('dance'); });
    renderPanel(0); renderPanel(1);
    let big;
    if (kind === 'race') {
      big = trophySVG;
      panels[winner].insertAdjacentHTML('beforeend', crownSVG);
      $('#turnBadge').textContent = winner + 1;
      $('#turnBadge').style.background = `var(--p${winner})`;
      $('#turnBadge').setAttribute('aria-label', `${nm(winner)} wins`);
    } else if (kind === 'team') {
      big = `<svg viewBox="0 0 100 100" class="big">${starSVG('#FFE000')}<path d="M50 74 C30 60 30 44 41 43 C46 43 49 46 50 49 C51 46 54 43 59 43 C70 44 70 60 50 74Z" fill="#FF3B30" stroke="${INK}" stroke-width="4"/></svg>`;
      panels.forEach(p => p.insertAdjacentHTML('beforeend', crownSVG));
      $('#turnBadge').innerHTML = `<svg viewBox="0 0 100 100" style="width:70%;height:70%">${starSVG('#fff')}</svg>`;
      $('#turnBadge').style.background = '#7B4DFF';
      $('#turnBadge').setAttribute('aria-label', 'Team wins');
    } else {
      big = `<svg viewBox="0 0 120 120" class="big">${owlSVG(0)}</svg>`;
      $('#turnBadge').innerHTML = `<svg viewBox="0 0 100 100" style="width:70%;height:70%"><path d="M66 14 A38 38 0 1 0 86 70 A30 30 0 0 1 66 14Z" fill="#FFE000" ${O}/></svg>`;
      $('#turnBadge').style.background = '#4B2FD6';
      $('#turnBadge').setAttribute('aria-label', 'The owl fell asleep');
    }
    $('#endBig').innerHTML = big;
    const endLine = kind === 'race' ? `${nm(winner)} finished first! Tap Play again for a new game.`
      : kind === 'team' ? 'You did it together! Both critters are done. Tap Play again for a new game.'
      : 'The owl fell asleep. Tap Play again to try again!';
    $('#coach').innerHTML = `<span class="chip" style="background:${kind === 'race' ? `var(--p${winner})` : '#A98BFF'}"></span><span>${endLine}</span>`;
    $('#againBtn').innerHTML = `<svg viewBox="0 0 100 100"><path d="M78 50 A28 28 0 1 1 64 26" fill="none" ${O} stroke-width="11"/><path d="M58 10 L74 28 L52 36 Z" fill="${INK}" ${O}/></svg>Play again`;
    if (kind !== 'sleep') { sfx.win(); confetti(); }
  }

  function confetti() {
    const box = $('#confetti');
    box.innerHTML = '';
    const colors = ['#FF8A00', '#1F8CFF', '#FFE000', '#00E07A', '#FF4FA3', '#7B4DFF'];
    for (let i = 0; i < 70; i++) {
      const c = document.createElement('div');
      c.className = 'cf';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = colors[i % colors.length];
      c.style.animationDuration = (1.6 + Math.random() * 1.4) + 's';
      c.style.animationDelay = Math.random() * 0.6 + 's';
      box.appendChild(c);
    }
    setTimeout(() => { box.innerHTML = ''; }, 4000);
  }

  // ================================================================
  // Setup & wiring
  // ================================================================
  function start(mode) {
    S = newState(mode);
    document.body.classList.remove('over');
    panels.forEach(p => { p.classList.remove('dance'); p.querySelectorAll('.crown').forEach(c => c.remove()); });
    $('#confetti').innerHTML = '';
    $('#picker').classList.remove('show'); $('#chooser').classList.remove('show'); $('#result').classList.remove('show');
    $('#modeScreen').classList.remove('show');
    renderAll();
  }

  // After Race/Team: Player 1 then Player 2 pick a name badge (or "No name").
  function pickNames(mode) {
    chosenBadges = [null, null];
    let who = 0;
    const scr = $('#badgeScreen');
    const next = () => {
      if (who === 0) { who = 1; draw(); return; }
      scr.classList.remove('show');
      start(mode);
    };
    const draw = () => {
      const num = $('#badgeNum');
      num.textContent = who + 1;
      num.style.background = `var(--p${who})`;
      $('#badgeTitle').textContent = `Player ${who + 1}, pick your name!`;
      $('#ownNameInput').value = '';
      const grid = $('#badgeGrid');
      grid.innerHTML = '';
      BADGES.forEach((b, i) => {
        const btn = document.createElement('button');
        const taken = chosenBadges.includes(b);
        btn.className = 'nameBadge' + (taken ? ' taken' : '');
        btn.style.setProperty('--c', b.color);
        btn.disabled = taken;
        btn.innerHTML = `${b.icon}<span>${b.name}</span>`;
        btn.onclick = () => { chosenBadges[who] = b; sfx.pop(); next(); };
        grid.appendChild(btn);
      });
    };
    $('#badgeSkip').onclick = () => { chosenBadges[who] = null; next(); };
    // Or type your own name: it gets a smiley badge in the player's colour.
    $('#ownName').onsubmit = e => {
      e.preventDefault();
      const input = $('#ownNameInput');
      const name = cleanName(input.value);
      if (!name) { input.classList.remove('nope'); void input.offsetWidth; input.classList.add('nope'); input.focus(); return; }
      input.blur();
      chosenBadges[who] = { name, color: `var(--p${who})`, icon: SMILEY };
      sfx.pop();
      next();
    };
    $('#modeScreen').classList.remove('show');
    scr.classList.add('show');
    draw();
  }

  function showModeScreen() {
    // Mid-game, the first tap arms the button (it turns red) and a second tap
    // within 3 seconds leaves. Browser confirm() dialogs are often blocked.
    const hb = $('#homeBtn');
    if (S && !S.over && S.rolls > 0 && !hb.classList.contains('armed')) {
      hb.classList.add('armed');
      clearTimeout(showModeScreen.t);
      showModeScreen.t = setTimeout(() => hb.classList.remove('armed'), 3000);
      return;
    }
    hb.classList.remove('armed');
    S = null;
    $('#picker').classList.remove('show'); $('#chooser').classList.remove('show'); $('#result').classList.remove('show');
    $('#modeScreen').classList.add('show');
  }

  function renderSoundBtn() {
    $('#soundBtn').innerHTML = `<svg viewBox="0 0 100 100"><path d="M14 38 H32 L56 18 V82 L32 62 H14 Z" fill="#FFE000" ${O}/>` +
      (soundOn ? `<path d="M68 34 Q80 50 68 66 M78 24 Q98 50 78 76" fill="none" ${O}/>`
               : `<path d="M68 36 L92 64 M92 36 L68 64" fill="none" stroke="#FF3B30" stroke-width="9" stroke-linecap="round"/>`) + `</svg>`;
    $('#soundBtn').setAttribute('aria-pressed', String(soundOn));
  }

  // Mode screen art
  $('#titleCritters').innerHTML =
    critterSVG({ 0: 0, 1: 0, 2: 0, 3: 1, 4: 1, 5: 1, 6: 0 }) +
    critterSVG({ 0: 2, 1: 2, 2: 2, 3: 2, 4: 0, 5: 0, 6: 2 }) +
    critterSVG({ 0: 1, 1: 1, 2: 1, 3: 0, 4: 2, 5: 2, 6: 1 });
  $('#raceBtn').innerHTML = `<svg viewBox="0 0 160 100">
      <path d="M118 10 V92" ${O} stroke-width="8"/>
      <path d="M118 12 H154 V44 H118 Z" fill="#fff" ${O}/>
      <path d="M118 12 H130 V22 H118 Z M142 12 H154 V22 H142 Z M130 22 H142 V33 H130 Z M118 33 H130 V44 H118 Z M142 33 H154 V44 H142 Z" fill="${INK}"/>
      <circle cx="30" cy="54" r="20" fill="var(--p0)" ${O}/><circle cx="72" cy="70" r="20" fill="var(--p1)" ${O}/>
      <path d="M2 54 H10 M4 44 H12 M4 64 H12 M44 70 H52 M46 60 H54 M46 80 H54" stroke="#fff" stroke-width="5" stroke-linecap="round"/></svg>Race`;
  $('#teamBtn').innerHTML = `<svg viewBox="0 0 160 100">
      <circle cx="40" cy="58" r="22" fill="var(--p0)" ${O}/><circle cx="84" cy="58" r="22" fill="var(--p1)" ${O}/>
      <path d="M62 34 C46 22 48 6 58 6 C62 6 62 10 62 12 C62 10 62 6 66 6 C76 6 78 22 62 34Z" fill="#FF3B30" stroke="${INK}" stroke-width="4"/>
      <g transform="translate(108 30) scale(.45)">${owlSVG(OWL_ROUNDS)}</g></svg>Team`;

  $('#raceBtn').onclick = () => pickNames('race');
  $('#teamBtn').onclick = () => pickNames('team');

  $('#wheel').onclick = spin;
  $('#wheel').onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); spin(); } };
  $('#cogBtn').innerHTML = `${gearMini}${gearMini}${gearMini}${ARROW}${questionIcon}<span>Pick any part</span>`;
  $('#cogBtn').onclick = useCogs;
  $('#nextBtn').onclick = nextTurn;
  $('#againBtn').onclick = () => start(S ? S.mode : 'race');
  $('#homeBtn').innerHTML = `<svg viewBox="0 0 100 100"><path d="M14 50 L50 16 L86 50 M24 42 V86 H76 V42" fill="#fff" ${O} stroke-width="8"/><rect x="42" y="60" width="16" height="26" fill="#FF8A00" ${O}/></svg>`;
  $('#homeBtn').onclick = showModeScreen;
  $('#soundBtn').onclick = () => { soundOn = !soundOn; renderSoundBtn(); };
  renderSoundBtn();

  // How-to-play card (for the grown-up running the game)
  const flagIcon = `<svg viewBox="0 0 100 100"><path d="M24 10 V92" ${O} stroke-width="8"/><path d="M24 12 H84 V56 H24 Z" fill="#fff" ${O}/><path d="M24 12 H44 V27 H24 Z M64 12 H84 V27 H64 Z M44 27 H64 V41 H44 Z M24 41 H44 V56 H24 Z M64 41 H84 V56 H64 Z" fill="${INK}"/></svg>`;
  const owlIcon = `<svg viewBox="0 0 120 120">${owlSVG(OWL_ROUNDS)}</svg>`;
  const hArrow = ARROW.replace('class="rarrow"', 'class="harrow"');
  const helpRows = [
    [SPIN_ICON, '<b>Tap the spinner</b> to spin it. When it stops, the gold and pink pointers each point at a part. <b>Tap the part you want.</b>'],
    [iconSVG(BODY) + hArrow + iconSVG(HEAD) + hArrow + iconSVG(EYES), 'Start with a <b>body</b>. Legs and arms need a body. Eyes, nose and hat need a <b>head</b>.'],
    [iconSVG(STAR), 'Land on the <b>star</b> and you can pick any part you need!'],
    [CHECK + CROSS + LOCK, 'Green check: it fits. Red X: you already have it. Lock: you need another part first.'],
    [CROSS + hArrow + gearMini, 'A part that doesn\'t fit can\'t be picked, so tap the one that does. If neither fits, you get a <b>spare part</b> cog.'],
    [gearMini + gearMini + gearMini + hArrow + questionIcon, 'With <b>3 cogs</b>, your turn starts by asking if you want to use them to pick any part (the cog button under the spinner does it too). You still spin after.'],
    [HEART, '<b>Team:</b> the part you don\'t take is a <b>gift</b> for your teammate. Once your critter is done, you pick which part to give.'],
    [spotSVG('swap'), '<b>Swap!</b> (twice a game) trades one part with the other critter, or tap the red X to skip.'],
    [ARROW, 'When your turn is over, tap the big <b>Go</b> button for the next player. The game waits for you.'],
    [BADGES[0].icon + BADGES[6].icon, 'After picking Race or Team, each player can pick a silly <b>name badge</b>, type their own name, or tap No name.'],
    [flagIcon, '<b>Race:</b> first finished critter wins.'],
    [owlIcon, '<b>Team:</b> finish both critters before the owl falls asleep. One moon goes out every turn.'],
  ];
  $('#helpBody').innerHTML = helpRows.map(([icons, text]) =>
    `<div class="hrow"><div class="hicons">${icons}</div><div class="htext">${text}</div></div>`).join('');
  $('#helpBody').style.cssText = 'display:grid;gap:1.1vh';
  $('#helpClose').innerHTML = `<svg viewBox="0 0 100 100"><path d="M20 20 L80 80 M80 20 L20 80" stroke="#fff" stroke-width="18" stroke-linecap="round"/></svg>`;
  const qBtn = `<svg viewBox="0 0 100 100"><path d="M34 36 Q34 18 50 18 Q68 18 68 35 Q68 48 52 54 L52 64" fill="none" ${O} stroke-width="11"/><circle cx="52" cy="82" r="7" fill="${INK}"/></svg>`;
  $('#helpBtn').innerHTML = qBtn;
  $('#modeHelp').innerHTML = qBtn;
  $('#helpBtn').onclick = $('#modeHelp').onclick = () => $('#help').classList.add('show');
  $('#helpClose').onclick = () => $('#help').classList.remove('show');

  // Space / Enter rolls (handy for the grown-up running the screen share)
  document.addEventListener('keydown', e => {
    if (!S || document.querySelector('.overlay.show')) return;
    if ((e.key === ' ' || e.key === 'Enter') && S.phase === 'roll' && document.activeElement?.tagName !== 'BUTTON' && document.activeElement?.id !== 'wheel') {
      e.preventDefault(); spin();
    } else if ((e.key === ' ' || e.key === 'Enter') && S.phase === 'done' && document.activeElement?.tagName !== 'BUTTON') {
      e.preventDefault(); nextTurn();
    } else if ((e.key === '1' || e.key === '2') && S.phase === 'pick') {
      pickDie(Number(e.key) - 1);
    }
  });
})();
</script>
</body>
</html>
