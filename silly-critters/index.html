<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Silly Critters</title>
<!--
  Silly Critters: a roll-and-build game for two young players (ages 5-6)
  sharing one screen over Zoom. Single self-contained file: no network,
  no build step. All critter art is original inline SVG.
-->
<style>
  :root {
    --p0: #FF8A00;
    --p1: #00BFFF;
    --ink: #111111;
    --bg: #E9EBF0;
    --gold: #FFE600;
    --card: #ffffff;
    /* Button colours: the spinner's wedge colours, brighter and solid */
    --grape: #A98BFF;
    --lemon: #FFE94D;
    --mint: #4DEBA6;
    --sky: #4DC3FF;
    --pink: #FF8CC0;
    --peach: #FFB259;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
    user-select: none; -webkit-user-select: none;
  }
  button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:disabled { cursor: default; }
  svg { display: block; }

  #app {
    height: 100%; display: grid;
    grid-template-rows: auto auto 1fr;
    gap: 1.2vh; padding: 1.2vh 1.4vw 1.6vh;
  }
  /* Coach line: plain-words directions for what to do right now. */
  #coach {
    display: flex; align-items: center; justify-content: center; gap: 1vw;
    min-height: 7vh; padding: .6vh 2vw; border-radius: 4px;
    background: var(--card); border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink);
    font-size: 3.6vh; font-weight: 700; line-height: 1.15; text-align: center; text-wrap: balance;
  }
  #coach .chip { flex: none; width: 4.4vh; height: 4.4vh; border-radius: 4px; border: 3px solid var(--ink); }
  #coach.pop { animation: coachPop .35s ease-out; }
  @keyframes coachPop { 0% { transform: scale(.94); } 60% { transform: scale(1.03); } 100% { transform: none; } }

  /* ---------- Top bar: turn badge + part chart ---------- */
  #topbar { display: flex; align-items: center; gap: 1.4vw; }
  #turnBadge {
    flex: none; width: 13vh; height: 13vh; border-radius: 4px;
    border: 4px solid var(--ink); background: var(--p0);
    display: flex; align-items: center; justify-content: center;
    font-size: 8.5vh; font-weight: 700; color: var(--ink); line-height: 1;
    box-shadow: 0 4px 0 var(--ink);
    transition: background .25s;
  }
  #turnBadge.flip { animation: badgeFlip .35s ease-out; }
  @keyframes badgeFlip { 0% { transform: scale(.6) rotate(-20deg); } 70% { transform: scale(1.12); } 100% { transform: none; } }

  #chart { flex: 1; display: grid; grid-template-columns: repeat(8, 1fr); gap: .6vw; }
  .tile {
    height: 12vh; background: var(--wf, var(--card)); border: 3px solid var(--ink); border-radius: 4px;
    display: flex; align-items: center; justify-content: center; gap: .4vw;
    box-shadow: 0 5px 0 var(--ink);
    transition: transform .15s, background .15s;
  }
  .tile .face { height: 5.5vh; width: 5.5vh; flex: none; }
  .tile .eq { width: 1.2vh; height: 1.2vh; flex: none; }
  .tile .icon { height: 7vh; width: 7vh; flex: none; }
  .tile { position: relative; }
  .tile.hl0, .tile.hl1 { transform: translateY(-4px) scale(1.08); border-width: 4px; }
  .tile.hl0 { background: #FFE000; }
  .tile.hl1 { background: #FF8CC0; }
  .tile.locked .icon { opacity: .3; }
  .tbadge { position: absolute; top: -1.6vh; right: -1.2vh; width: 5.4vh; height: 5.4vh; display: none; }
  .tile.have .tbadge.check, .tile.locked .tbadge.lock { display: block; }

  .roundBtn {
    flex: none; width: 7vh; height: 7vh; border-radius: 4px;
    border: 3px solid var(--ink); background: var(--card); padding: .9vh;
    box-shadow: 0 4px 0 var(--ink);
  }
  #soundBtn { background: var(--sky); }
  #helpBtn, #modeHelp { background: var(--lemon); }
  #homeBtn { background: var(--peach); }
  #homeBtn.armed { background: #FF3B30; animation: shake .4s; }
  .sideBtns { display: grid; grid-template-columns: repeat(2, 7vh); gap: 1vh; }
  #modeHelp { position: absolute; top: 2.5vh; right: 2.5vw; width: 9vh; height: 9vh; }

  /* ---------- Board: two critter panels + centre column ---------- */
  #board {
    display: grid; min-height: 0;
    grid-template-columns: 1fr minmax(260px, 31vw) 1fr;
    gap: 1.6vw;
  }
  .panel {
    position: relative; min-height: 0;
    background: var(--card); border: 5px solid var(--ink); border-radius: 4px;
    display: flex; flex-direction: column; align-items: center;
    padding: 1vh 1vw;
    transition: transform .25s, opacity .25s, filter .25s, box-shadow .25s;
  }
  #panel0 { border-color: var(--p0); }
  #panel1 { border-color: var(--p1); }
  .panel.idle { opacity: .5; filter: saturate(.55); transform: scale(.96); }
  .panel.active { box-shadow: 0 0 0 7px var(--gold), 0 10px 0 7px var(--ink); }
  .panel .num {
    position: absolute; top: 1.2vh; left: 1.2vw;
    width: 8vh; height: 8vh; border-radius: 4px; border: 3px solid var(--ink);
    color: var(--ink); font-weight: 700; font-size: 5vh; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  #panel0 .num { background: var(--p0); }
  #panel1 .num { background: var(--p1); }
  .arrow {
    position: absolute; top: -1vh; right: 2vw; width: 11vh; height: 9vh;
    display: none; z-index: 2;
    animation: arrowBob .8s ease-in-out infinite;
  }
  .panel.active .arrow { display: block; }
  @keyframes arrowBob { 0%,100% { margin-top: -2vh; } 50% { margin-top: 0; } }
  .stage { flex: 1; min-height: 0; width: 100%; }
  .stage svg { width: 100%; height: 100%; }
  .foot { width: 100%; display: flex; flex-direction: column; align-items: center; gap: .8vh; }
  .progress { display: flex; gap: .6vw; }
  .progress .pi {
    width: 6vh; height: 6vh; border-radius: 2px; border: 3px solid #C3C8D8; background: #EEF1F7;
    padding: .3vh; position: relative;
  }
  .progress .pi svg { width: 100%; height: 100%; opacity: .25; filter: grayscale(1); }
  .progress .pi.got { border-color: var(--ink); background: #D9F6E8; }
  .progress .pi.got svg { opacity: 1; filter: none; }
  .tokens { display: flex; align-items: center; gap: .7vw; min-height: 8vh; }
  .tok { width: 6.5vh; height: 6.5vh; }
  .tok.new { animation: popIn .4s cubic-bezier(.3,1.8,.5,1); }
  .tok.full { animation: shake .4s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  @keyframes glow { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }

  /* ---------- Centre column ---------- */
  #center {
    display: flex; flex-direction: column; align-items: center; justify-content: space-evenly;
    gap: 1.5vh; min-height: 0;
  }
  /* Spinner: two pointers (gold top, pink bottom) each land on a wedge. */
  #wheel { width: min(30vw, 47vh); height: min(30vw, 47vh); flex: none; }
  #wheel .hubLabel { display: none; }
  #wheel.ready { cursor: pointer; animation: wheelPulse 1.4s ease-in-out infinite; }
  #wheel.ready .hubLabel { display: block; }
  #wheel.ready:hover { filter: brightness(1.05); }
  #wheel:focus { outline: none; }
  #wheel:focus-visible { outline: 4px dashed var(--ink); outline-offset: 6px; }
  @keyframes wheelPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.035); } }
  #wheel .wedge.lit0 path { fill: #FFE000; }
  #wheel .wedge.lit1 path { fill: #FF8CC0; }
  #spinRow { width: 100%; display: flex; justify-content: center; }
  #spinRow[hidden] { display: none; }
  #dice[hidden] { display: none; }
  /* The two landed parts are buttons: tap the one you want. */
  #dice { width: 100%; display: flex; justify-content: center; gap: 1vw; }
  .dieChoice {
    flex: 1 1 0; max-width: 15vw; min-width: 0;
    display: flex; flex-direction: row; align-items: center; justify-content: center; gap: .6vw;
    padding: 1vh .5vw; border-radius: 4px; border: 4px solid transparent; background: transparent;
    transition: transform .12s, opacity .2s, background .2s;
  }
  .dieChoice:disabled { cursor: default; }
  .dface { width: min(4.5vw, 6vh); height: min(4.5vw, 6vh); }
  .dface svg { width: 100%; height: 100%; }
  .dpart { position: relative; width: min(6vw, 9vh); height: min(6vw, 9vh); }
  .dpart > svg { width: 100%; height: 100%; }
  .dpart.empty { border: 3px dashed #C3C8D8; border-radius: 4px; }
  .dbadge { position: absolute; right: -1.2vh; bottom: -1.2vh; width: 50%; height: 50%; }
  .dbadge svg { width: 100%; height: 100%; }
  .dgift { display: flex; flex-direction: column; align-items: center; gap: .3vh; }
  .dgift svg { width: 4vh; height: 4vh; }
  .dieChoice.pickable { background: var(--lemon); border-color: var(--ink); box-shadow: 0 6px 0 var(--ink); cursor: pointer; animation: breathe 1.2s ease-in-out infinite; }
  #dice .dieChoice.pickable:nth-child(2) { background: var(--pink); }
  .dieChoice.pickable:hover { transform: translateY(-4px); }
  .dieChoice.chosen { background: var(--lemon); border-color: var(--ink); }
  .dieChoice.giftDie { background: var(--pink); border-color: var(--ink); }
  .dieChoice.faded { opacity: .35; }
  /* The star is always gold, whichever pointer lands on it. */
  #dice .dieChoice.starChoice { background: var(--lemon); }
  #dice.single .dieChoice { max-width: 18vw; }
  #dice.single .dface { width: min(14vw, 20vh); height: min(14vw, 20vh); }
  #cogBtn {
    width: 100%; padding: 0 1vh; height: 10vh; border-radius: 4px;
    border: 4px solid var(--ink); background: var(--lemon); box-shadow: 0 7px 0 var(--ink);
    font-size: 3.4vh; font-weight: 700; color: var(--ink);
    display: none; align-items: center; justify-content: center; gap: .6vw;
    animation: breathe 1.3s ease-in-out infinite;
  }
  #cogBtn svg { width: 5vh; height: 5vh; flex: none; }
  #cogBtn .rarrow { width: 3vh; height: 2.4vh; }
  #cogBtn.show { display: flex; }
  #nextBtn {
    width: 100%; min-height: 13vh; border-radius: 4px; padding: 1vh 1vw;
    border: 4px solid var(--ink); box-shadow: 0 9px 0 var(--ink);
    display: flex; align-items: center; justify-content: center; gap: 1vw;
    font-size: 4.4vh; font-weight: 700; color: var(--ink); line-height: 1.05;
    animation: breathe 1.6s ease-in-out infinite;
  }
  #nextBtn[hidden] { display: none; }
  #nextBtn svg { width: 7vh; height: 7vh; flex: none; }
  .okBtn {
    display: flex; align-items: center; gap: 1vw; padding: 1vh 3vw;
    border-radius: 4px; border: 4px solid var(--ink); background: var(--mint); box-shadow: 0 6px 0 var(--ink);
    font-size: 4.4vh; font-weight: 700; color: var(--ink);
  }
  .okBtn svg { width: 6vh; height: 6vh; }
  .okBtn.later { background: var(--card); }
  .cardTitle { font-size: 4.4vh; font-weight: 700; text-align: center; }
  @keyframes tumble { 0% { transform: rotate(0) translateY(0); } 50% { transform: rotate(14deg) translateY(-8px); } 100% { transform: rotate(-14deg) translateY(0); } }
  @keyframes land { 0% { transform: scale(1.35); } 100% { transform: scale(1); } }
  @keyframes breathe { 0%,100% { scale: 1; } 50% { scale: 1.04; } }

  #owlBox { display: none; align-items: center; gap: .8vw; }
  #owlBox.show { display: flex; }
  #owl { width: 11vh; height: 11vh; flex: none; }
  #owl.tick { animation: popIn .35s; }
  #moons { display: grid; grid-template-columns: repeat(6, 2.8vh); gap: .7vh; }
  .moon { width: 2.8vh; height: 2.8vh; border-radius: 50%; border: 3px solid var(--ink); background: var(--gold); transition: background .3s, transform .3s; }
  .moon.gone { background: #6B6F8E; transform: scale(.75); }

  #endBox { display: none; flex-direction: column; align-items: center; gap: 2vh; }
  #endBox .big { width: min(18vw, 26vh); height: min(18vw, 26vh); animation: popIn .5s cubic-bezier(.3,1.8,.5,1); }
  #againBtn {
    width: 100%; min-height: 17vh; border-radius: 4px;
    border: 4px solid var(--ink); background: var(--mint);
    box-shadow: 0 9px 0 var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 4.6vh; font-weight: 700; color: var(--ink); line-height: 1.05; padding: 1vh;
    animation: breathe 1.4s ease-in-out infinite;
  }
  #againBtn svg { width: 8vh; height: 8vh; }
  body.over #dice, body.over #spinRow, body.over #nextBtn, body.over #wheel, body.over #cogBtn, body.over #owlBox { display: none; }
  body.over #endBox { display: flex; }
  body.over .panel { opacity: 1; filter: none; transform: none; box-shadow: none; }
  body.over .panel .arrow { display: none; }

  /* ---------- Critter animations ---------- */
  .critter { animation: bob 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 90%; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .part.pop { animation: popIn .4s cubic-bezier(.3,1.8,.5,1); transform-box: fill-box; transform-origin: center; }
  @keyframes popIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }
  .googly { animation: googly 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes googly { 0%,100% { transform: translate(0,0); } 30% { transform: translate(4px,3px); } 60% { transform: translate(-4px,2px); } }
  .prop { animation: prop .45s linear infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes prop { 0%,100% { transform: scaleX(1); } 50% { transform: scaleX(.12); } }
  .dance .critter { animation: dance .55s ease-in-out infinite alternate; }
  #panel1.dance .critter { animation-delay: -.27s; }
  @keyframes dance {
    0% { transform: translateY(0) rotate(-9deg) scale(1, 1); }
    50% { transform: translateY(-22px) rotate(0) scale(.95, 1.06); }
    100% { transform: translateY(0) rotate(9deg) scale(1.04, .96); }
  }
  .crown { position: absolute; top: -5vh; right: -1.5vw; width: 16vh; height: 14vh; rotate: 18deg; z-index: 3; animation: popIn .5s cubic-bezier(.3,1.8,.5,1); }

  /* ---------- Overlays ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 10;
    background: rgba(29, 29, 43, .6);
    display: none; align-items: center; justify-content: center;
  }
  .overlay.show { display: flex; }
  .card {
    position: relative;
    background: var(--card); border: 5px solid var(--ink); border-radius: 4px;
    padding: 3vh 3vw; display: flex; flex-direction: column; align-items: center; gap: 2.5vh;
    box-shadow: 0 12px 0 var(--ink);
    animation: popIn .25s ease-out;
    max-width: 96vw;
  }
  .cardHead { display: flex; align-items: center; gap: 1.5vw; }
  .cardHead svg { width: 13vh; height: 13vh; }
  .opts { display: flex; gap: 2vw; }
  .opt {
    width: min(26vw, 46vh); height: min(32vw, 54vh); padding: 1vh;
    background: #FFFFFF; border: 4px solid var(--ink); border-radius: 4px;
    box-shadow: 0 7px 0 var(--ink);
    transition: transform .12s;
  }
  #picker .opt:nth-child(1) { background: #D8CCFF; }
  #picker .opt:nth-child(2) { background: #B8F7D8; }
  #picker .opt:nth-child(3) { background: #BFE6FF; }
  .opt.small:nth-child(6n+1) { background: var(--grape); }
  .opt.small:nth-child(6n+2) { background: var(--lemon); }
  .opt.small:nth-child(6n+3) { background: var(--mint); }
  .opt.small:nth-child(6n+4) { background: var(--sky); }
  .opt.small:nth-child(6n+5) { background: var(--pink); }
  .opt.small:nth-child(6n+6) { background: var(--peach); }
  .opt:hover { transform: translateY(-5px) scale(1.03); }
  .opt:active { transform: translateY(4px); box-shadow: 0 3px 0 var(--ink); }
  .opt svg { width: 100%; height: 100%; }
  .opt.small { width: 17vh; height: 17vh; padding: 1.6vh; }
  .xBtn {
    position: absolute; top: -3.5vh; right: -3.5vh; width: 9vh; height: 9vh; border-radius: 4px;
    border: 4px solid var(--ink); background: #FF3B30; padding: 1.8vh; box-shadow: 0 5px 0 var(--ink);
  }

  /* ---------- Roll result card ---------- */
  #result { z-index: 15; background: rgba(43, 39, 69, .3); cursor: pointer; }
  #result .card { gap: 1.6vh; padding: 2.6vh 3vw; }
  .rrow { display: flex; align-items: center; justify-content: center; gap: 1.6vw; }
  .rrow > svg, .rrow .rpart { width: 17vh; height: 17vh; flex: none; }
  .rrow.small > svg, .rrow.small .rpart { width: 10vh; height: 10vh; }
  .rrow .rarrow { width: 9vh; height: 6vh; }
  .rpart { position: relative; }
  .rpart > svg { width: 100%; height: 100%; }
  .rbadge { position: absolute; right: -1.5vh; bottom: -1.5vh; width: 45%; height: 45%; animation: popIn .35s .25s both cubic-bezier(.3,1.8,.5,1); }
  .rbadge svg { width: 100%; height: 100%; }
  .rcap { font-size: 4.4vh; font-weight: 700; text-align: center; line-height: 1.15; max-width: 60vw; }
  .rplus { font-size: 7vh; font-weight: 700; color: var(--ink); }

  /* ---------- Help ---------- */
  #help { z-index: 30; }
  #help .xBtn { top: 1.2vh; right: 1.2vh; width: 7vh; height: 7vh; padding: 1.4vh; border-radius: 4px; }
  #help .card { max-height: 94vh; overflow-y: auto; gap: 1.4vh; padding-top: 2vh; align-items: stretch; width: min(92vw, 120vh); }
  .hrow { display: grid; grid-template-columns: 30vh 1fr; align-items: center; gap: 2vw; }
  .hicons { display: flex; align-items: center; justify-content: flex-end; gap: .6vh; }
  .hicons svg { width: 5.6vh; height: 5.6vh; flex: none; }
  .hicons .harrow { width: 4vh; height: 3vh; }
  .htext { font-size: 2.8vh; line-height: 1.2; padding-right: 6vh; }
  .htext b { font-weight: 700; }

  /* ---------- Name badges ---------- */
  #badgeScreen { background: var(--bg); flex-direction: column; gap: 3vh; padding: 3vh 3vw; }
  .badgeHead { display: flex; align-items: center; gap: 2vw; font-size: 5vh; font-weight: 800; text-align: center; }
  .bnum {
    flex: none; width: 9vh; height: 9vh; border: 4px solid var(--ink); border-radius: 4px;
    display: flex; align-items: center; justify-content: center; font-size: 6vh; font-weight: 800;
    box-shadow: 0 4px 0 var(--ink);
  }
  .badgeGrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2vh 2vw; width: min(96vw, 150vh); }
  .nameBadge {
    display: flex; align-items: center; gap: 1vw; padding: 1.2vh 1vw; min-width: 0;
    background: var(--c); border: 4px solid var(--ink); border-radius: 4px; box-shadow: 0 6px 0 var(--ink);
    font-size: 3.2vh; font-weight: 800; color: var(--ink); text-align: left; line-height: 1.1;
    transition: transform .12s;
  }
  .nameBadge:not(:disabled):hover { transform: translateY(-4px); }
  .nameBadge svg { flex: none; width: 7vh; height: 7vh; background: #fff; border: 3px solid var(--ink); border-radius: 50%; padding: .5vh; }
  .nameBadge.taken { opacity: .35; }
  .ownName { display: flex; gap: 1vw; width: min(96vw, 90vh); }
  .ownName input {
    flex: 1; min-width: 0; font: inherit; font-size: max(16px, 3.2vh); font-weight: 700; color: var(--ink);
    padding: 1.2vh 1.4vw; background: var(--card); border: 4px solid var(--ink); border-radius: 4px; box-shadow: 0 5px 0 var(--ink);
  }
  .ownName input::placeholder { color: #8A8FA8; }
  .ownName input:focus { outline: 4px solid var(--sky); outline-offset: 2px; }
  .ownName input.nope { animation: shake .4s; }
  .ownName button {
    flex: none; font-size: max(16px, 3.2vh); font-weight: 800; padding: 0 3vw; color: var(--ink);
    background: var(--mint); border: 4px solid var(--ink); border-radius: 4px; box-shadow: 0 5px 0 var(--ink);
  }
  #badgeSkip {
    font-size: 3vh; font-weight: 700; padding: 1.2vh 3vw; color: var(--ink);
    background: var(--card); border: 3px solid var(--ink); border-radius: 4px; box-shadow: 0 4px 0 var(--ink);
  }
  /* Name tag on each critter's panel */
  .nameTag {
    position: absolute; top: 1.2vh; left: calc(1.2vw + 8vh + .8vw); max-width: calc(100% - 8vh - 15vh);
    display: flex; align-items: center; gap: .5vw; padding: .4vh .7vw;
    border: 3px solid var(--ink); border-radius: 4px; font-size: 2.6vh; font-weight: 800; line-height: 1.1;
  }
  .nameTag[hidden] { display: none; }
  .nameTag svg { flex: none; width: 4.4vh; height: 4.4vh; background: #fff; border: 2px solid var(--ink); border-radius: 50%; padding: .3vh; }

  /* ---------- Mode screen ---------- */
  #modeScreen { background: var(--bg); flex-direction: column; gap: 4vh; }
  #modeScreen h1 {
    margin: 0; font-size: 11vh; font-weight: 800; color: #FF8A00; letter-spacing: 0;
    text-shadow: 4px 4px 0 #00BFFF, 4px 4px 0 1px var(--ink);
  }
  .titleCritters { display: flex; gap: 4vw; }
  .titleCritters svg { width: 24vh; height: 30vh; }
  .modes { display: flex; gap: 4vw; }
  .modeBtn {
    width: min(34vw, 46vh); height: 32vh; border-radius: 4px; border: 5px solid var(--ink);
    box-shadow: 0 10px 0 var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1vh;
    font-size: 6vh; font-weight: 700; color: var(--ink);
    transition: transform .12s;
  }
  .modeBtn:hover { transform: translateY(-5px) scale(1.03); }
  .modeBtn svg { height: 18vh; width: 30vh; }
  #raceBtn { background: var(--peach); }
  #teamBtn { background: var(--grape); }

  /* ---------- Big flash + confetti ---------- */
  #flash {
    position: fixed; left: 50%; top: 50%; z-index: 20; pointer-events: none;
    width: 40vh; height: 40vh; margin: -20vh 0 0 -20vh; display: none;
  }
  #flash.show { display: block; animation: flash .8s ease-out forwards; }
  @keyframes flash {
    0% { transform: scale(.2) rotate(-90deg); opacity: 0; }
    30% { transform: scale(1.1) rotate(0); opacity: 1; }
    75% { transform: scale(1) rotate(20deg); opacity: 1; }
    100% { transform: scale(1.3) rotate(40deg); opacity: 0; }
  }
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
  .cf { position: absolute; top: -4vh; width: 1.6vh; height: 2.4vh; border-radius: 2px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(112vh) rotate(720deg); } }

  /* ---------- Phone (portrait) layout ----------
     Chart strip on top, coach line, the two critters side by side,
     then the spinner and its controls underneath. */
  @media (max-aspect-ratio: 4/5), (max-width: 600px) {
    #app { gap: 1vh; padding: 1vh 2.5vw 1.2vh; }
    #topbar { flex-wrap: wrap; justify-content: space-between; gap: 1vh 2vw; }
    #turnBadge { width: 12vw; height: 12vw; font-size: 8vw; border-width: 3px; }
    .sideBtns { grid-template-columns: repeat(3, 10vw); gap: 2vw; }
    .roundBtn { width: 10vw; height: 10vw; padding: 1.4vw; }
    #chart { order: 3; flex: 0 0 100%; gap: 1.2vw; }
    .tile { height: auto; padding: 1vw 0; flex-direction: column; gap: .3vw; box-shadow: 0 3px 0 var(--ink); }
    .tile .eq { display: none; }
    .tile .face { width: 6.5vw; height: 6.5vw; }
    .tile .icon { width: 8vw; height: 8vw; }
    .tbadge { width: 5vw; height: 5vw; top: -1.5vw; right: -1.2vw; }
    #coach { min-height: 0; padding: 1vw 2.5vw; font-size: 3.7vw; gap: 2vw; }
    #coach .chip { width: 3.6vw; height: 3.6vw; }

    #board { grid-template-columns: 1fr 1fr; grid-template-rows: minmax(0, 34%) minmax(0, 1fr); gap: 2.5vw; }
    #panel0 { grid-column: 1; grid-row: 1; }
    #panel1 { grid-column: 2; grid-row: 1; }
    #center { grid-column: 1 / -1; grid-row: 2; justify-content: space-between; gap: 1vh; }
    .panel { border-width: 5px; padding: .6vh 1vw; }
    .panel.idle { transform: scale(.97); }
    .panel .num { width: 7vw; height: 7vw; font-size: 4.5vw; top: 1vw; left: 1vw; border-width: 3px; }
    .arrow { width: 9vw; height: 7vw; }
    .foot { gap: .4vh; }
    .progress { gap: .5vw; }
    .progress .pi { width: 5.2vw; height: 5.2vw; border-width: 2px; border-radius: 3px; padding: .2vw; }
    .tokens { min-height: 0; gap: 1.2vw; }
    .tok { width: 5.5vw; height: 5.5vw; }
    .crown { width: 13vw; height: 11vw; top: -4vw; right: -2vw; }

    /* The spinner takes whatever height is left, so everything fits on any phone. */
    #wheel { flex: 1 1 0; min-height: 0; width: 100%; height: auto; max-width: 84vw; }
    #dice { gap: 3vw; }
    .dieChoice { max-width: 46vw; gap: 2vw; padding: 1vh 2vw; }
    .dface { width: 8vw; height: 8vw; }
    .dpart { width: min(14vw, 8vh); height: min(14vw, 8vh); }
    .dgift svg { width: 5.5vw; height: 5.5vw; }
    #dice.single .dieChoice { max-width: 50vw; }
    #dice.single .dface { width: min(30vw, 14vh); height: min(30vw, 14vh); }
    #cogBtn { height: 8vh; font-size: 4.2vw; }
    #cogBtn svg { width: 6vw; height: 6vw; }
    #nextBtn { min-height: 8vh; font-size: 5vw; }
    #nextBtn svg { width: 9vw; height: 9vw; }
    #owlBox { gap: 3vw; }
    #owl { width: 7vh; height: 7vh; }
    #moons { grid-template-columns: repeat(9, 2.4vh); gap: .6vh; }
    .moon { width: 2.4vh; height: 2.4vh; border-width: 2px; }
    #endBox { gap: 1.5vh; width: 100%; }
    #endBox .big { width: min(40vw, 20vh); height: min(40vw, 20vh); }
    #againBtn { min-height: 10vh; font-size: 6vw; }

    /* Pop-up cards */
    .card { padding: 2.5vh 4vw; gap: 1.8vh; border-width: 4px; max-width: 94vw; }
    .cardTitle { font-size: 5vw; padding: 0 8vw; }
    .cardHead svg { width: 13vw; height: 13vw; }
    .opts { gap: 2.5vw; flex-wrap: wrap; justify-content: center; }
    .opt { width: 27vw; height: 38vw; padding: .5vw; border-width: 3px; }
    .opt.small { width: 20vw; height: 20vw; padding: 2vw; }
    .xBtn { width: 11vw; height: 11vw; top: -4vw; right: -3vw; padding: 2.4vw; }
    .rrow > svg, .rrow .rpart { width: 20vw; height: 20vw; }
    .rrow.small > svg, .rrow.small .rpart { width: 12vw; height: 12vw; }
    .rrow .rarrow { width: 9vw; height: 6vw; }
    .rcap { font-size: 5vw; max-width: 84vw; }
    .rplus { font-size: 9vw; }
    .okBtn { font-size: 5.5vw; padding: 1vh 7vw; }
    .okBtn svg { width: 8vw; height: 8vw; }
    #help .card { width: 94vw; padding: 2vh 3vw; }
    #help .xBtn { width: 9vw; height: 9vw; top: 1vh; right: 1vh; padding: 1.8vw; }
    .hrow { grid-template-columns: 30vw 1fr; gap: 3vw; }
    .hicons svg { width: 7vw; height: 7vw; }
    .hicons .harrow { width: 4vw; height: 3vw; }
    .htext { font-size: 3.6vw; padding-right: 8vw; }

    /* Name badges */
    #badgeScreen { gap: 2vh; padding: 2vh 3vw; }
    .badgeHead { font-size: 5.5vw; gap: 3vw; }
    .bnum { width: 11vw; height: 11vw; font-size: 7vw; }
    .badgeGrid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.6vh 3vw; width: 94vw; }
    .nameBadge { font-size: 4.2vw; padding: 1vh 2vw; gap: 2vw; }
    .nameBadge svg { width: 10vw; height: 10vw; }
    #badgeSkip { font-size: 4.5vw; padding: 1vh 6vw; }
    .ownName { width: 94vw; gap: 2vw; }
    .ownName input { font-size: max(16px, 4.5vw); padding: 1.2vh 3vw; }
    .ownName button { font-size: max(16px, 4.5vw); padding: 0 6vw; }
    .nameTag { top: 1vw; left: calc(1vw + 7vw + 1.5vw); max-width: calc(100% - 7vw - 12vw); font-size: 2.8vw; padding: .3vw .8vw; gap: 1vw; border-width: 2px; }
    .nameTag svg { width: 4.6vw; height: 4.6vw; }

    /* Mode picker */
    #modeScreen { gap: 3vh; padding: 0 4vw; }
    #modeScreen h1 { font-size: 11vw; }
    .titleCritters svg { width: 26vw; height: 32vw; }
    .modes { flex-direction: column; gap: 3vh; }
    .modeBtn { width: 80vw; height: 19vh; font-size: 8vw; }
    .modeBtn svg { height: 11vh; width: 40vw; }
    #modeHelp { width: 11vw; height: 11vw; top: 2vh; right: 3vw; }
  }

  @media (prefers-reduced-motion: reduce) {
    .critter, .googly, .prop, #wheel.ready, .arrow, #againBtn { animation: none !important; }
  }
</style>
</head>
<body>

<div id="app">
  <header id="topbar">
    <div id="turnBadge" role="status" aria-live="polite" aria-label="Player 1's turn">1</div>
    <div id="chart" aria-label="Part chart"></div>
    <div class="sideBtns">
      <button id="soundBtn" class="roundBtn" aria-label="Sound on or off"></button>
      <button id="helpBtn" class="roundBtn" aria-label="How to play"></button>
      <button id="homeBtn" class="roundBtn" aria-label="Pick a game mode"></button>
    </div>
  </header>
  <div id="coach" role="status" aria-live="polite"></div>

  <main id="board">
    <section class="panel" id="panel0" aria-label="Player 1's critter">
      <svg class="arrow" viewBox="0 0 110 90"><path d="M15 8 H95 L55 82 Z" fill="var(--p0)" stroke="#111111" stroke-width="8" stroke-linejoin="round"/></svg>
      <div class="num">1</div>
      <div class="nameTag" hidden></div>
      <div class="stage"></div>
      <div class="foot">
        <div class="progress"></div>
        <div class="tokens"></div>
      </div>
    </section>

    <section id="center">
      <svg id="wheel" viewBox="-120 -124 240 248" role="button" tabindex="0" aria-label="Spinner: tap to spin"></svg>
      <div id="spinRow">
        <button id="cogBtn" aria-label="Use 3 spare parts to pick any part"></button>
      </div>
      <div id="dice" aria-label="Pick a part" hidden></div>
      <button id="nextBtn" hidden></button>
      <div id="owlBox">
        <svg id="owl" viewBox="0 0 120 120" aria-label="Sleepy owl timer"></svg>
        <div id="moons"></div>
      </div>
      <div id="endBox">
        <div id="endBig"></div>
        <button id="againBtn" aria-label="Play again"></button>
      </div>
    </section>

    <section class="panel" id="panel1" aria-label="Player 2's critter">
      <svg class="arrow" viewBox="0 0 110 90"><path d="M15 8 H95 L55 82 Z" fill="var(--p1)" stroke="#111111" stroke-width="8" stroke-linejoin="round"/></svg>
      <div class="num">2</div>
      <div class="nameTag" hidden></div>
      <div class="stage"></div>
      <div class="foot">
        <div class="progress"></div>
        <div class="tokens"></div>
      </div>
    </section>
  </main>
</div>

<!-- Pick one of 3 versions of a part -->
<div class="overlay" id="picker"><div class="card"><div class="cardTitle"></div><div class="cardHead"></div><div class="opts"></div></div></div>
<!-- Pick a part type (spare-part trade, or Swap) -->
<div class="overlay" id="chooser"><div class="card"><button class="xBtn" aria-label="No thanks"></button><div class="cardTitle"></div><div class="cardHead"></div><div class="opts"></div></div></div>

<div class="overlay show" id="modeScreen">
  <button id="modeHelp" class="roundBtn" aria-label="How to play"></button>
  <h1>Silly Critters</h1>
  <div class="titleCritters" id="titleCritters"></div>
  <div class="modes">
    <button class="modeBtn" id="raceBtn" aria-label="Race mode: first critter finished wins"></button>
    <button class="modeBtn" id="teamBtn" aria-label="Team mode: finish both critters before the owl falls asleep"></button>
  </div>
</div>

<!-- Each player picks a silly name badge (optional) -->
<div class="overlay" id="badgeScreen">
  <div class="badgeHead"><div class="bnum" id="badgeNum">1</div><div id="badgeTitle"></div></div>
  <div class="badgeGrid" id="badgeGrid"></div>
  <form class="ownName" id="ownName">
    <input id="ownNameInput" maxlength="16" autocomplete="off" enterkeyhint="done" placeholder="Or type your own name" aria-label="Type your own name">
    <button type="submit">OK</button>
  </form>
  <button id="badgeSkip">No name</button>
</div>

<!-- What the roll means: shown briefly after every roll; tap to skip -->
<div class="overlay" id="result" role="status" aria-live="polite"><div class="card"></div></div>
<!-- Rules in pictures, for the grown-up -->
<div class="overlay" id="help"><div class="card"><button class="xBtn" id="helpClose" aria-label="Close"></button><div id="helpBody"></div></div></div>

<svg id="flash" viewBox="0 0 100 100" aria-hidden="true"></svg>
<div id="confetti"></div>

<script>
(() => {
  'use strict';

  // ================================================================
  // Parts & rules
  // ================================================================
  // Part ids double as the starting chart order: die face 1 = body ... 6 = hat.
  const BODY = 0, HEAD = 1, EYES = 2, LEGS = 3, NOSE = 4, HAT = 5, ARMS = 6;
  const PART_NAMES = ['body', 'head', 'eyes', 'legs', 'nose', 'hat', 'arms'];
  const NEEDS = [[], [BODY], [HEAD], [BODY], [HEAD], [HEAD], [BODY]];
  // Arms and legs tuck behind the body.
  const DRAW_ORDER = [LEGS, ARMS, BODY, HEAD, EYES, NOSE, HAT];
  // The star wedge: not a part, it lets you pick any part you need.
  const STAR = 7;
  const LABEL = [...PART_NAMES, 'star'];
  const PLURAL = new Set([EYES, LEGS, ARMS]);
  const WEDGES = 8, STEP = 360 / WEDGES;     // spinner wedges and degrees per wedge
  const OWL_ROUNDS = 18;   // owl timer, counted in turns (each player's roll is one turn)
  const MAX_TOKENS = 3;

  const INK = '#111111';
  const O = `stroke="${INK}" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"`;
  // A thick coloured line with a dark outline (for tentacles, springs, antennae).
  const line = (d, color, w) =>
    `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w + 12}" stroke-linecap="round" stroke-linejoin="round"/>` +
    `<path d="${d}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;

  // Overlapping circles drawn as one shape with a single outline (clouds, puffs).
  const blob = (circles, fill) =>
    circles.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${INK}" stroke="${INK}" stroke-width="12"/>`).join('') +
    circles.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}"/>`).join('');
  // Five-point star path centred on (cx, cy).
  const starPath = (cx, cy, R, r) => Array.from({ length: 10 }, (_, i) => {
    const a = -Math.PI / 2 + i * Math.PI / 5, d = i % 2 ? r : R;
    return `${i ? 'L' : 'M'}${(cx + d * Math.cos(a)).toFixed(1)} ${(cy + d * Math.sin(a)).toFixed(1)}`;
  }).join(' ') + ' Z';

  // ================================================================
  // Original critter art: 6 versions of each part (the picker offers 3 at random).
  // Critter canvas is viewBox "0 -50 300 420"; head centre ~(150,118), body ~(150,242).
  // ================================================================
  const ART = [
    // ---- BODY ----
    [
      () => `<ellipse cx="150" cy="242" rx="98" ry="68" fill="#7B4DFF" ${O}/>
             <ellipse cx="150" cy="256" rx="56" ry="38" fill="#C4B0FF"/>
             <circle cx="86" cy="222" r="9" fill="#5B30F0"/><circle cx="214" cy="222" r="9" fill="#5B30F0"/>`,
      () => `<path d="M150 176 C215 176 240 230 233 262 C226 298 190 308 150 308 C110 308 74 298 67 262 C60 230 85 176 150 176Z" fill="#00E07A" ${O}/>
             <path d="M82 232 Q150 250 218 232" stroke="#8FF5C8" stroke-width="12" fill="none" stroke-linecap="round"/>
             <path d="M80 270 Q150 290 220 270" stroke="#8FF5C8" stroke-width="12" fill="none" stroke-linecap="round"/>`,
      () => `<rect x="58" y="178" width="184" height="124" rx="46" fill="#FF4FA3" ${O}/>
             <circle cx="100" cy="220" r="11" fill="#FFAAD0"/><circle cx="160" cy="238" r="13" fill="#FFAAD0"/>
             <circle cx="210" cy="212" r="9" fill="#FFAAD0"/><circle cx="118" cy="276" r="10" fill="#FFAAD0"/>
             <circle cx="200" cy="270" r="12" fill="#FFAAD0"/>`,
      // Gumdrop with a star on the tummy
      () => `<path d="M150 172 C204 172 238 250 242 286 Q244 306 150 306 Q56 306 58 286 C62 250 96 172 150 172Z" fill="#FF7A00" ${O}/>
             <path d="M150 226 L158 246 L180 247 L163 260 L169 281 L150 269 L131 281 L137 260 L120 247 L142 246 Z" fill="#FFE000" ${O} stroke-width="4"/>`,
      // Blue egg with a zigzag stripe
      () => `<ellipse cx="150" cy="242" rx="88" ry="72" fill="#17A2FF" ${O}/>
             <path d="M70 244 L90 228 L110 244 L130 228 L150 244 L170 228 L190 244 L210 228 L230 244" fill="none" stroke="#fff" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>`,
      // Fluffy cloud
      () => blob([[102, 228, 40], [150, 212, 44], [198, 228, 40], [120, 272, 38], [180, 272, 38], [150, 262, 46]], '#BFE6FF'),
    ],
    // ---- HEAD (each comes with its own mouth) ----
    [
      () => `<circle cx="94" cy="68" r="22" fill="#FFE000" ${O}/><circle cx="206" cy="68" r="22" fill="#FFE000" ${O}/>
             <circle cx="94" cy="68" r="10" fill="#FF8CC0"/><circle cx="206" cy="68" r="10" fill="#FF8CC0"/>
             <circle cx="150" cy="118" r="68" fill="#FFE000" ${O}/>
             <ellipse cx="102" cy="142" rx="12" ry="8" fill="#FF8CC0"/><ellipse cx="198" cy="142" rx="12" ry="8" fill="#FF8CC0"/>
             <path d="M122 158 Q150 180 178 158" fill="none" ${O}/>`,
      () => line('M118 60 L96 22', '#17A2FF', 6) + line('M182 60 L204 22', '#17A2FF', 6) +
            `<circle cx="96" cy="20" r="11" fill="#FFE000" ${O}/><circle cx="204" cy="20" r="11" fill="#FFE000" ${O}/>
             <rect x="82" y="54" width="136" height="128" rx="38" fill="#17A2FF" ${O}/>
             <path d="M120 152 Q150 186 180 152 Z" fill="#F0203C" ${O}/>
             <rect x="137" y="152" width="12" height="10" fill="#fff"/><rect x="152" y="152" width="12" height="10" fill="#fff"/>`,
      () => `<path d="M100 70 L80 44 L112 56 L118 26 L136 50 L150 18 L164 50 L182 26 L188 56 L220 44 L200 70 Z" fill="#6E4529" ${O}/>
             <ellipse cx="150" cy="118" rx="64" ry="74" fill="#00D9C8" ${O}/>
             <circle cx="112" cy="146" r="3.5" fill="#00B3A6"/><circle cx="104" cy="138" r="3.5" fill="#00B3A6"/><circle cx="118" cy="136" r="3.5" fill="#00B3A6"/>
             <circle cx="188" cy="146" r="3.5" fill="#00B3A6"/><circle cx="196" cy="138" r="3.5" fill="#00B3A6"/><circle cx="182" cy="136" r="3.5" fill="#00B3A6"/>
             <path d="M124 164 q9 -9 18 0 t18 0 t18 0" fill="none" ${O}/>`,
      // Cat with whiskers
      () => `<path d="M94 84 L84 22 L132 56 Z M206 84 L216 22 L168 56 Z" fill="#FF8CC0" ${O}/>
             <path d="M98 70 L92 38 L118 58 Z M202 70 L208 38 L182 58 Z" fill="#FFD0E6"/>
             <circle cx="150" cy="118" r="66" fill="#FF8CC0" ${O}/>
             <path d="M112 146 L66 138 M112 154 L66 160 M188 146 L234 138 M188 154 L234 160" stroke="${INK}" stroke-width="4" stroke-linecap="round"/>
             <path d="M130 160 q10 10 20 0 q10 10 20 0" fill="none" ${O}/>`,
      // Square monster with horns and fangs
      () => `<path d="M100 66 Q80 30 104 20 Q104 44 120 58 Z M200 66 Q220 30 196 20 Q196 44 180 58 Z" fill="#FFF6A8" ${O}/>
             <rect x="80" y="54" width="140" height="128" rx="30" fill="#00E07A" ${O}/>
             <path d="M114 150 Q150 186 186 150 Z" fill="#F0203C" ${O}/>
             <path d="M130 151 L138 151 L134 162 Z M162 151 L170 151 L166 162 Z" fill="#fff" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>`,
      // Round head with a feather crest and a big smile
      () => `<g transform="rotate(-25 150 60)"><ellipse cx="150" cy="40" rx="10" ry="26" fill="#FF4FA3" ${O}/></g>
             <ellipse cx="150" cy="34" rx="10" ry="28" fill="#FFE000" ${O}/>
             <g transform="rotate(25 150 60)"><ellipse cx="150" cy="40" rx="10" ry="26" fill="#17A2FF" ${O}/></g>
             <ellipse cx="150" cy="120" rx="70" ry="64" fill="#D8CCFF" ${O}/>
             <path d="M118 152 Q150 186 182 152 Z" fill="#fff" ${O}/>
             <path d="M136 164 Q150 178 164 164" fill="#FF8CC0"/>`,
    ],
    // ---- EYES ----
    [
      () => `<circle cx="122" cy="104" r="21" fill="#fff" ${O}/><circle cx="178" cy="104" r="21" fill="#fff" ${O}/>
             <g class="googly"><circle cx="126" cy="109" r="9" fill="${INK}"/><circle cx="174" cy="99" r="9" fill="${INK}"/></g>`,
      () => `<circle cx="150" cy="100" r="31" fill="#fff" ${O}/><circle cx="150" cy="102" r="16" fill="#1F8CFF"/>
             <circle cx="150" cy="102" r="8" fill="${INK}"/><circle cx="156" cy="96" r="4" fill="#fff"/>
             <path d="M118 66 Q150 54 182 66" fill="none" ${O}/>`,
      () => `<circle cx="112" cy="110" r="14" fill="#fff" ${O}/><circle cx="150" cy="92" r="14" fill="#fff" ${O}/><circle cx="188" cy="110" r="14" fill="#fff" ${O}/>
             <g class="googly"><circle cx="114" cy="112" r="6" fill="${INK}"/><circle cx="152" cy="94" r="6" fill="${INK}"/><circle cx="190" cy="112" r="6" fill="${INK}"/></g>`,
      // Sleepy eyes
      () => [124, 176].map(x => `<circle cx="${x}" cy="104" r="19" fill="#fff" ${O}/>
             <circle cx="${x}" cy="111" r="7" fill="${INK}"/>
             <path d="M${x - 19} 104 A19 19 0 0 1 ${x + 19} 104 Z" fill="#C4B0FF" ${O}/>`).join(''),
      // Star sunglasses
      () => `<path d="M138 100 L162 100" ${O}/>` + [122, 178].map(x => `<path d="${starPath(x, 104, 24, 11)}" fill="#2B2745" ${O}/>
             <circle cx="${x - 6}" cy="98" r="4" fill="#fff"/>`).join(''),
      // Heart eyes
      () => [122, 178].map(x => `<path d="M${x} 118 C${x - 26} 100 ${x - 16} 82 ${x} 94 C${x + 16} 82 ${x + 26} 100 ${x} 118 Z" fill="#FF3B30" ${O}/>
             <circle cx="${x - 7}" cy="96" r="3.5" fill="#fff"/>`).join(''),
    ],
    // ---- LEGS (drawn behind the body) ----
    [
      () => `<rect x="94" y="268" width="36" height="72" rx="15" fill="#FF7A00" ${O}/><rect x="170" y="268" width="36" height="72" rx="15" fill="#FF7A00" ${O}/>
             <ellipse cx="102" cy="344" rx="32" ry="16" fill="#FF7A00" ${O}/><ellipse cx="198" cy="344" rx="32" ry="16" fill="#FF7A00" ${O}/>`,
      () => [88, 126, 174, 212].map((x, i) =>
